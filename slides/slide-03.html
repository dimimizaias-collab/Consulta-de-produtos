<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NextGen Mobility — Slide 3: Visão</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary-dark: #003BA0;
      --primary-cyan: #00D4FF;
      --accent-green: #2ECC71;
      --dark-gray: #0f0f0f;
      --white: #FFFFFF;
    }

    body {
      font-family: 'Segoe UI', 'Roboto', -apple-system, sans-serif;
      background: var(--dark-gray);
      color: var(--white);
      overflow: hidden;
      margin: 0;
    }

    .slide-container {
      width: 1920px;
      height: 1080px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px;
      background: linear-gradient(135deg, var(--dark-gray) 0%, var(--primary-dark) 100%);
      flex-direction: column;
    }

    h1 {
      font-size: 64px;
      margin-bottom: 80px;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(90deg, var(--white), var(--primary-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .vision-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 40px;
      width: 100%;
      max-width: 1600px;
    }

    .vision-card {
      position: relative;
      padding: 40px;
      background: rgba(0, 212, 255, 0.03);
      border-left: 5px solid var(--primary-cyan);
      border-radius: 8px;
      backdrop-filter: blur(10px);
      transition: all 0.4s ease;
    }

    .vision-card:hover {
      border-left-color: var(--accent-green);
      background: rgba(46, 204, 113, 0.05);
    }

    .vision-card h3 {
      font-size: 24px;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--primary-cyan);
    }

    .vision-card p {
      font-size: 14px;
      line-height: 1.8;
      color: rgba(255, 255, 255, 0.8);
    }

    .slide-controls {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 20px;
      z-index: 100;
    }

    button {
      background: var(--primary-cyan);
      color: var(--dark-gray);
      border: none;
      padding: 12px 24px;
      font-size: 14px;
      cursor: pointer;
      border-radius: 8px;
      font-weight: 600;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    button:hover {
      background: var(--accent-green);
      transform: translateY(-2px);
    }

    .slide-counter {
      position: fixed;
      bottom: 40px;
      right: 40px;
      font-size: 14px;
      color: var(--primary-cyan);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .slide-nav {
      position: fixed;
      top: 40px;
      left: 40px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
    }

    a {
      color: var(--primary-cyan);
      text-decoration: none;
    }

    a:hover {
      color: var(--accent-green);
    }
  </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
  function Slide() {
    return (
      <>
        <div className="slide-container">
          <h1>Missão • Visão • Valores</h1>
          <div className="vision-grid">
            <div className="vision-card">
              <h3>🎯 Missão</h3>
              <p>Liderar a transformação da mobilidade global com tecnologia sustentável, inovação contínua e excelência operacional.</p>
            </div>
            <div className="vision-card">
              <h3>🌍 Visão</h3>
              <p>Ser a marca de referência em veículos elétricos, híbridos e hidrogênio, reconhecida por qualidade e sustentabilidade.</p>
            </div>
            <div className="vision-card">
              <h3>⚡ Valores</h3>
              <p>Inovação disruptiva, integridade ambiental, excelência em tudo que fazemos e comprometimento com nossos stakeholders.</p>
            </div>
          </div>
        </div>

        <div className="slide-nav">
          <a href="index.html">← Voltar ao Índice</a>
        </div>

        <div className="slide-controls">
          <button onClick={() => window.location.href = 'slide-02.html'}>← Anterior</button>
          <button onClick={() => window.location.href = 'slide-04.html'}>Próximo →</button>
        </div>

        <div className="slide-counter">Slide 3 / 12</div>
      </>
    );
  }

  ReactDOM.render(<Slide />, document.getElementById('root'));
</script>

</body>
</html>
