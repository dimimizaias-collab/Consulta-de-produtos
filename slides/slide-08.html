<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NextGen Mobility — Slide 8: Ranking</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary-dark: #003BA0;
      --primary-cyan: #00D4FF;
      --accent-green: #2ECC71;
      --dark-gray: #0f0f0f;
      --white: #FFFFFF;
    }

    body {
      font-family: 'Segoe UI', 'Roboto', -apple-system, sans-serif;
      background: var(--dark-gray);
      color: var(--white);
      overflow: hidden;
      margin: 0;
    }

    .slide-container {
      width: 1920px;
      height: 1080px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px;
      background: linear-gradient(135deg, var(--primary-dark) 0%, var(--dark-gray) 100%);
      flex-direction: column;
    }

    h1 {
      font-size: 64px;
      margin-bottom: 80px;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(90deg, var(--white), var(--primary-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .podium-container {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 40px;
      width: 100%;
      max-width: 1000px;
      perspective: 1000px;
    }

    .podium {
      text-align: center;
      transform-style: preserve-3d;
    }

    .podium.silver { order: 1; }
    .podium.gold { order: 2; margin: 0 20px; }
    .podium.bronze { order: 3; }

    .podium-rank {
      font-size: 20px;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 900;
      height: 40px;
    }

    .podium.silver .podium-rank { color: #c0c0c0; }
    .podium.gold .podium-rank { color: #ffd700; }
    .podium.bronze .podium-rank { color: #cd7f32; }

    .podium-box {
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .podium.silver .podium-box {
      background: linear-gradient(135deg, rgba(192, 192, 192, 0.2), rgba(192, 192, 192, 0.1));
      border: 2px solid #c0c0c0;
      height: 200px;
    }

    .podium.gold .podium-box {
      background: linear-gradient(135deg, rgba(255, 215, 0, 0.2), rgba(255, 215, 0, 0.1));
      border: 3px solid #ffd700;
      height: 280px;
    }

    .podium.bronze .podium-box {
      background: linear-gradient(135deg, rgba(205, 127, 50, 0.2), rgba(205, 127, 50, 0.1));
      border: 2px solid #cd7f32;
      height: 160px;
    }

    .podium-name {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .podium-value {
      font-size: 24px;
      font-weight: 900;
      color: var(--primary-cyan);
      font-family: 'Courier New', monospace;
    }

    .slide-controls {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 20px;
      z-index: 100;
    }

    button {
      background: var(--primary-cyan);
      color: var(--dark-gray);
      border: none;
      padding: 12px 24px;
      font-size: 14px;
      cursor: pointer;
      border-radius: 8px;
      font-weight: 600;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    button:hover {
      background: var(--accent-green);
      transform: translateY(-2px);
    }

    .slide-counter {
      position: fixed;
      bottom: 40px;
      right: 40px;
      font-size: 14px;
      color: var(--primary-cyan);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .slide-nav {
      position: fixed;
      top: 40px;
      left: 40px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
    }

    a {
      color: var(--primary-cyan);
      text-decoration: none;
    }

    a:hover {
      color: var(--accent-green);
    }
  </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
  function Slide() {
    return (
      <>
        <div className="slide-container">
          <h1>Desempenho vs Concorrentes</h1>
          <div className="podium-container">
            <div className="podium silver">
              <div className="podium-rank">2º LUGAR</div>
              <div className="podium-box">
                <div className="podium-name">Vecchia Vetta</div>
                <div className="podium-value">33.07%</div>
              </div>
            </div>
            <div className="podium gold">
              <div className="podium-rank">🏆 3º LUGAR</div>
              <div className="podium-box">
                <div className="podium-name">NextGen Mobility</div>
                <div className="podium-value">26.51%</div>
              </div>
            </div>
            <div className="podium bronze">
              <div className="podium-rank">1º LUGAR</div>
              <div className="podium-box">
                <div className="podium-name">FlexTech</div>
                <div className="podium-value">45.22%</div>
              </div>
            </div>
          </div>
        </div>

        <div className="slide-nav">
          <a href="index.html">← Voltar ao Índice</a>
        </div>

        <div className="slide-controls">
          <button onClick={() => window.location.href = 'slide-07.html'}>← Anterior</button>
          <button onClick={() => window.location.href = 'slide-09.html'}>Próximo →</button>
        </div>

        <div className="slide-counter">Slide 8 / 12</div>
      </>
    );
  }

  ReactDOM.render(<Slide />, document.getElementById('root'));
</script>

</body>
</html>
