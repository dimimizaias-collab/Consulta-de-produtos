<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NextGen Mobility — Slide 12: Conclusão</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary-dark: #003BA0;
      --primary-cyan: #00D4FF;
      --accent-green: #2ECC71;
      --dark-gray: #0f0f0f;
      --white: #FFFFFF;
    }

    body {
      font-family: 'Segoe UI', 'Roboto', -apple-system, sans-serif;
      background: var(--dark-gray);
      color: var(--white);
      overflow: hidden;
      margin: 0;
    }

    .slide-container {
      width: 1920px;
      height: 1080px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px;
      background: linear-gradient(135deg, var(--primary-dark) 0%, var(--dark-gray) 100%);
      flex-direction: column;
      text-align: center;
    }

    h1 {
      font-size: 72px;
      margin-bottom: 60px;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(90deg, var(--white), var(--primary-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .conclusion-text {
      font-size: 20px;
      line-height: 1.8;
      color: rgba(255, 255, 255, 0.9);
      max-width: 1000px;
      margin-bottom: 60px;
    }

    .cta-button {
      padding: 16px 40px;
      background: linear-gradient(135deg, var(--primary-cyan), var(--accent-green));
      color: var(--dark-gray);
      border: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .cta-button:hover {
      transform: scale(1.05);
      box-shadow: 0 20px 40px rgba(0, 212, 255, 0.3);
    }

    .slide-controls {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 20px;
      z-index: 100;
    }

    button {
      background: var(--primary-cyan);
      color: var(--dark-gray);
      border: none;
      padding: 12px 24px;
      font-size: 14px;
      cursor: pointer;
      border-radius: 8px;
      font-weight: 600;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    button:hover {
      background: var(--accent-green);
      transform: translateY(-2px);
    }

    .slide-counter {
      position: fixed;
      bottom: 40px;
      right: 40px;
      font-size: 14px;
      color: var(--primary-cyan);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .slide-nav {
      position: fixed;
      top: 40px;
      left: 40px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
    }

    a {
      color: var(--primary-cyan);
      text-decoration: none;
    }

    a:hover {
      color: var(--accent-green);
    }
  </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
  function Slide() {
    return (
      <>
        <div className="slide-container">
          <h1>Conclusão</h1>
          <div className="conclusion-text">
            NextGen Mobility alcançou resultados significativos consolidando-se como empresa inovadora e competitiva. Os aprendizados adquiridos fortalecem nossa visão de sustentabilidade e excelência operacional. <br/><br/>
            <strong>O futuro é mobilidade sustentável. O tempo é agora.</strong>
          </div>
          <button className="cta-button">Próximas Ações</button>
        </div>

        <div className="slide-nav">
          <a href="index.html">← Voltar ao Índice</a>
        </div>

        <div className="slide-controls">
          <button onClick={() => window.location.href = 'slide-11.html'}>← Anterior</button>
          <button onClick={() => window.location.href = 'slide-01.html'}>Voltar ao Início</button>
        </div>

        <div className="slide-counter">Slide 12 / 12</div>
      </>
    );
  }

  ReactDOM.render(<Slide />, document.getElementById('root'));
</script>

</body>
</html>
