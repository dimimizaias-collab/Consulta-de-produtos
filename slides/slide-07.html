<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NextGen Mobility — Slide 7: Financeiro</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary-dark: #003BA0;
      --primary-cyan: #00D4FF;
      --accent-green: #2ECC71;
      --dark-gray: #0f0f0f;
      --white: #FFFFFF;
    }

    body {
      font-family: 'Segoe UI', 'Roboto', -apple-system, sans-serif;
      background: var(--dark-gray);
      color: var(--white);
      overflow: hidden;
      margin: 0;
    }

    .slide-container {
      width: 1920px;
      height: 1080px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px;
      background: linear-gradient(135deg, var(--dark-gray) 0%, var(--primary-dark) 100%);
      flex-direction: column;
    }

    h1 {
      font-size: 64px;
      margin-bottom: 80px;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(90deg, var(--white), var(--primary-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .financial-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 30px;
      width: 100%;
      max-width: 1500px;
    }

    .financial-card {
      background: linear-gradient(135deg, rgba(0, 212, 255, 0.1), rgba(46, 204, 113, 0.1));
      border: 2px solid var(--primary-cyan);
      border-radius: 12px;
      padding: 40px;
      text-align: center;
      backdrop-filter: blur(10px);
    }

    .financial-value {
      font-size: 42px;
      font-weight: 900;
      color: var(--primary-cyan);
      margin-bottom: 16px;
      font-family: 'Courier New', monospace;
    }

    .financial-label {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .slide-controls {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 20px;
      z-index: 100;
    }

    button {
      background: var(--primary-cyan);
      color: var(--dark-gray);
      border: none;
      padding: 12px 24px;
      font-size: 14px;
      cursor: pointer;
      border-radius: 8px;
      font-weight: 600;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    button:hover {
      background: var(--accent-green);
      transform: translateY(-2px);
    }

    .slide-counter {
      position: fixed;
      bottom: 40px;
      right: 40px;
      font-size: 14px;
      color: var(--primary-cyan);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .slide-nav {
      position: fixed;
      top: 40px;
      left: 40px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
    }

    a {
      color: var(--primary-cyan);
      text-decoration: none;
    }

    a:hover {
      color: var(--accent-green);
    }
  </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
  function Slide() {
    return (
      <>
        <div className="slide-container">
          <h1>Indicadores Financeiros — Período 8</h1>
          <div className="financial-grid">
            <div className="financial-card">
              <div className="financial-value">101.1B</div>
              <div className="financial-label">Receita Total</div>
            </div>
            <div className="financial-card">
              <div className="financial-value">24.3B</div>
              <div className="financial-label">Lucro Líquido</div>
            </div>
            <div className="financial-card">
              <div className="financial-value">42.7%</div>
              <div className="financial-label">Margem Bruta</div>
            </div>
            <div className="financial-card">
              <div className="financial-value">24.4%</div>
              <div className="financial-label">ROE</div>
            </div>
          </div>
        </div>

        <div className="slide-nav">
          <a href="index.html">← Voltar ao Índice</a>
        </div>

        <div className="slide-controls">
          <button onClick={() => window.location.href = 'slide-06.html'}>← Anterior</button>
          <button onClick={() => window.location.href = 'slide-08.html'}>Próximo →</button>
        </div>

        <div className="slide-counter">Slide 7 / 12</div>
      </>
    );
  }

  ReactDOM.render(<Slide />, document.getElementById('root'));
</script>

</body>
</html>
