<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NextGen Mobility — Slide 5: Aprendizados</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary-dark: #003BA0;
      --primary-cyan: #00D4FF;
      --accent-green: #2ECC71;
      --dark-gray: #0f0f0f;
      --white: #FFFFFF;
    }

    body {
      font-family: 'Segoe UI', 'Roboto', -apple-system, sans-serif;
      background: var(--dark-gray);
      color: var(--white);
      overflow: hidden;
      margin: 0;
    }

    .slide-container {
      width: 1920px;
      height: 1080px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px;
      background: linear-gradient(135deg, var(--dark-gray) 0%, var(--primary-dark) 100%);
      flex-direction: column;
    }

    h1 {
      font-size: 64px;
      margin-bottom: 80px;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(90deg, var(--white), var(--primary-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .learnings-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 40px;
      width: 100%;
      max-width: 1400px;
    }

    .learning-card {
      background: linear-gradient(135deg, rgba(0, 212, 255, 0.1), rgba(46, 204, 113, 0.1));
      border: 1px solid var(--primary-cyan);
      border-radius: 12px;
      padding: 40px;
      display: flex;
      align-items: center;
      gap: 30px;
    }

    .learning-number {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, var(--primary-cyan), var(--accent-green));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      font-weight: bold;
      flex-shrink: 0;
    }

    .learning-text h3 {
      font-size: 18px;
      margin-bottom: 8px;
      color: var(--primary-cyan);
    }

    .learning-text p {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
      line-height: 1.6;
    }

    .slide-controls {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 20px;
      z-index: 100;
    }

    button {
      background: var(--primary-cyan);
      color: var(--dark-gray);
      border: none;
      padding: 12px 24px;
      font-size: 14px;
      cursor: pointer;
      border-radius: 8px;
      font-weight: 600;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    button:hover {
      background: var(--accent-green);
      transform: translateY(-2px);
    }

    .slide-counter {
      position: fixed;
      bottom: 40px;
      right: 40px;
      font-size: 14px;
      color: var(--primary-cyan);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .slide-nav {
      position: fixed;
      top: 40px;
      left: 40px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
    }

    a {
      color: var(--primary-cyan);
      text-decoration: none;
    }

    a:hover {
      color: var(--accent-green);
    }
  </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
  function Slide() {
    return (
      <>
        <div className="slide-container">
          <h1>Aprendizados da Rodada</h1>
          <div className="learnings-grid">
            <div className="learning-card">
              <div className="learning-number">1</div>
              <div className="learning-text">
                <h3>Equilíbrio Receita-Custos</h3>
                <p>Disciplina financeira essencial para sustentabilidade</p>
              </div>
            </div>
            <div className="learning-card">
              <div className="learning-number">2</div>
              <div className="learning-text">
                <h3>Gestão de Cash Flow</h3>
                <p>Inventário crítico para liquidez operacional</p>
              </div>
            </div>
            <div className="learning-card">
              <div className="learning-number">3</div>
              <div className="learning-text">
                <h3>Diversificação</h3>
                <p>Múltiplos produtos e mercados reduzem risco</p>
              </div>
            </div>
            <div className="learning-card">
              <div className="learning-number">4</div>
              <div className="learning-text">
                <h3>Análise de Dados</h3>
                <p>Decisões orientadas por números, não opinião</p>
              </div>
            </div>
          </div>
        </div>

        <div className="slide-nav">
          <a href="index.html">← Voltar ao Índice</a>
        </div>

        <div className="slide-controls">
          <button onClick={() => window.location.href = 'slide-04.html'}>← Anterior</button>
          <button onClick={() => window.location.href = 'slide-06.html'}>Próximo →</button>
        </div>

        <div className="slide-counter">Slide 5 / 12</div>
      </>
    );
  }

  ReactDOM.render(<Slide />, document.getElementById('root'));
</script>

</body>
</html>
