<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NextGen Mobility — Índice de Slides</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary-dark: #003BA0;
      --primary-cyan: #00D4FF;
      --accent-green: #2ECC71;
      --dark-gray: #0f0f0f;
      --white: #FFFFFF;
      --light-gray: #f5f5f5;
    }

    body {
      font-family: 'Segoe UI', 'Roboto', -apple-system, sans-serif;
      background: linear-gradient(135deg, var(--dark-gray) 0%, var(--primary-dark) 50%, var(--dark-gray) 100%);
      color: var(--white);
      padding: 60px 40px;
      min-height: 100vh;
    }

    .container {
      max-width: 1600px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 80px;
    }

    .logo-svg {
      width: 100px;
      height: 100px;
      margin: 0 auto 20px;
    }

    h1 {
      font-size: 56px;
      font-weight: 900;
      letter-spacing: -2px;
      margin-bottom: 20px;
      background: linear-gradient(135deg, var(--white) 0%, var(--primary-cyan) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .tagline {
      font-size: 20px;
      font-weight: 300;
      letter-spacing: 3px;
      color: var(--accent-green);
      text-transform: uppercase;
    }

    .subtitle {
      font-size: 18px;
      color: rgba(255, 255, 255, 0.7);
      margin-top: 20px;
    }

    .slides-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 30px;
      margin-bottom: 60px;
    }

    .slide-card {
      background: linear-gradient(135deg, rgba(0, 212, 255, 0.1), rgba(46, 204, 113, 0.05));
      border: 2px solid var(--primary-cyan);
      border-radius: 12px;
      padding: 30px;
      text-decoration: none;
      color: inherit;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 220px;
    }

    .slide-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(46, 204, 113, 0.2), transparent);
      animation: slide-shimmer 2.5s infinite;
    }

    @keyframes slide-shimmer {
      0% { left: -100%; }
      100% { left: 100%; }
    }

    .slide-card:hover {
      border-color: var(--accent-green);
      transform: translateY(-12px);
      box-shadow: 0 25px 50px rgba(46, 204, 113, 0.25);
    }

    .slide-number {
      font-size: 14px;
      color: var(--accent-green);
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 700;
      position: relative;
      z-index: 1;
    }

    .slide-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--primary-cyan);
      margin: 16px 0 12px;
      position: relative;
      z-index: 1;
    }

    .slide-description {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
      line-height: 1.6;
      position: relative;
      z-index: 1;
      flex-grow: 1;
    }

    .slide-cta {
      font-size: 12px;
      color: var(--accent-green);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 16px;
      position: relative;
      z-index: 1;
      font-weight: 600;
    }

    .footer {
      text-align: center;
      padding-top: 40px;
      border-top: 1px solid rgba(0, 212, 255, 0.2);
      color: rgba(255, 255, 255, 0.6);
      font-size: 14px;
    }

    .info-box {
      background: rgba(0, 212, 255, 0.05);
      border-left: 4px solid var(--primary-cyan);
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 40px;
      color: rgba(255, 255, 255, 0.9);
    }

    .info-box h3 {
      color: var(--primary-cyan);
      margin-bottom: 8px;
      font-size: 16px;
    }

    .info-box p {
      font-size: 14px;
      line-height: 1.6;
    }
  </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
  const LogoSVG = () => (
    <svg className="logo-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stopColor="#00D4FF" />
          <stop offset="100%" stopColor="#2ECC71" />
        </linearGradient>
      </defs>
      <path d="M 50 170 L 50 50 L 150 150 L 150 50" stroke="url(#logoGrad)" strokeWidth="16" fill="none" strokeLinecap="round" strokeLinejoin="round" />
      <line x1="30" y1="100" x2="170" y2="100" stroke="#00D4FF" strokeWidth="2" opacity="0.5" />
      <line x1="30" y1="130" x2="170" y2="130" stroke="#00D4FF" strokeWidth="2" opacity="0.3" />
    </svg>
  );

  function Index() {
    const slides = [
      {
        num: '01',
        title: 'Capa',
        description: 'Apresentação Premium — NextGen Mobility'
      },
      {
        num: '02',
        title: 'Nossa Equipe',
        description: 'Lideranças estratégicas e competências'
      },
      {
        num: '03',
        title: 'Missão • Visão • Valores',
        description: 'Identidade e propósito da empresa'
      },
      {
        num: '04',
        title: 'Análise Ambiental',
        description: 'Cenário do mercado e posicionamento'
      },
      {
        num: '05',
        title: 'Aprendizados',
        description: 'Lições da rodada CESIM'
      },
      {
        num: '06',
        title: 'Indicadores Mercadológicos',
        description: 'Performance em mercados-chave'
      },
      {
        num: '07',
        title: 'Indicadores Financeiros',
        description: 'KPIs financeiros do Período 8'
      },
      {
        num: '08',
        title: 'Ranking 3D',
        description: 'Posição vs concorrentes (Podium)'
      },
      {
        num: '09',
        title: 'Desafios & Aprendizagens',
        description: 'Jornada e insights do período'
      },
      {
        num: '10',
        title: 'Cenários Futuros',
        description: 'Visão otimista e cenário base'
      },
      {
        num: '11',
        title: 'Carreira & Competências',
        description: 'Implicações profissionais'
      },
      {
        num: '12',
        title: 'Conclusão',
        description: 'Mensagem final e call-to-action'
      }
    ];

    return (
      <div className="container">
        <header>
          <LogoSVG />
          <h1>NEXTGEN MOBILITY</h1>
          <div className="tagline">Apresentação Automotiva Premium</div>
          <div className="subtitle">Simulação CESIM — 12 Slides Interativos</div>
        </header>

        <div className="info-box">
          <h3>📊 Navegação</h3>
          <p>Clique em qualquer slide abaixo para visualizá-lo em tela cheia. Use as setas no rodapé de cada slide para navegação entre slides. Teclas de seta (← →) também funcionam para navegação rápida.</p>
        </div>

        <div className="slides-grid">
          {slides.map((slide, idx) => (
            <a
              key={idx}
              href={`slide-${String(slide.num).padStart(2, '0')}.html`}
              className="slide-card"
            >
              <div className="slide-number">SLIDE {slide.num}</div>
              <div className="slide-title">{slide.title}</div>
              <div className="slide-description">{slide.description}</div>
              <div className="slide-cta">Abrir Slide →</div>
            </a>
          ))}
        </div>

        <div className="footer">
          <p>NextGen Mobility © 2025 — Apresentação Executiva CESIM</p>
          <p style={{marginTop: '8px', fontSize: '12px'}}>
            Desenvolvido com React 18 + CSS Grid Layout | Suporta navegação por teclado (← →)
          </p>
        </div>
      </div>
    );
  }

  ReactDOM.render(<Index />, document.getElementById('root'));
</script>

</body>
</html>
