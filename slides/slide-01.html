<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NextGen Mobility — Slide 1: Capa</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary-dark: #003BA0;
      --primary-cyan: #00D4FF;
      --accent-green: #2ECC71;
      --dark-gray: #0f0f0f;
      --white: #FFFFFF;
    }

    body {
      font-family: 'Segoe UI', 'Roboto', -apple-system, sans-serif;
      background: var(--dark-gray);
      color: var(--white);
      overflow: hidden;
      margin: 0;
    }

    .slide-container {
      width: 1920px;
      height: 1080px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slide-1 {
      background: linear-gradient(135deg, var(--dark-gray) 0%, var(--primary-dark) 50%, #051a3f 100%);
      position: relative;
      overflow: hidden;
      width: 100%;
      height: 100%;
    }

    .slide-1::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(90deg, transparent 0%, rgba(0, 212, 255, 0.05) 50%, transparent 100%);
      animation: shimmer 4s infinite;
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .logo-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 10;
    }

    .logo-svg {
      width: 140px;
      height: 140px;
      margin: 0 auto 20px;
    }

    .logo-text {
      font-size: 96px;
      font-weight: 900;
      letter-spacing: -2px;
      margin: 40px 0 20px 0;
      background: linear-gradient(135deg, var(--white) 0%, var(--primary-cyan) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .tagline {
      font-size: 32px;
      font-weight: 300;
      letter-spacing: 4px;
      color: var(--accent-green);
      text-transform: uppercase;
      margin-top: 40px;
    }

    .motion-lines {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      opacity: 0.6;
    }

    .slide-controls {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 20px;
      z-index: 100;
    }

    button {
      background: var(--primary-cyan);
      color: var(--dark-gray);
      border: none;
      padding: 12px 24px;
      font-size: 14px;
      cursor: pointer;
      border-radius: 8px;
      font-weight: 600;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    button:hover {
      background: var(--accent-green);
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(46, 204, 113, 0.3);
    }

    .slide-counter {
      position: fixed;
      bottom: 40px;
      right: 40px;
      font-size: 14px;
      color: var(--primary-cyan);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .slide-nav {
      position: fixed;
      top: 40px;
      left: 40px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
    }

    a {
      color: var(--primary-cyan);
      text-decoration: none;
      transition: all 0.3s ease;
    }

    a:hover {
      color: var(--accent-green);
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
  const LogoSVG = () => (
    <svg className="logo-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stopColor="#00D4FF" />
          <stop offset="100%" stopColor="#2ECC71" />
        </linearGradient>
      </defs>
      <path d="M 50 170 L 50 50 L 150 150 L 150 50" stroke="url(#logoGrad)" strokeWidth="16" fill="none" strokeLinecap="round" strokeLinejoin="round" />
      <line x1="30" y1="100" x2="170" y2="100" stroke="#00D4FF" strokeWidth="2" opacity="0.5" />
      <line x1="30" y1="130" x2="170" y2="130" stroke="#00D4FF" strokeWidth="2" opacity="0.3" />
    </svg>
  );

  function Slide() {
    return (
      <>
        <div className="slide-container slide-1">
          <svg className="motion-lines" viewBox="0 0 1920 1080">
            <line x1="0" y1="300" x2="1920" y2="300" stroke="rgba(0, 212, 255, 0.1)" strokeWidth="2" />
            <line x1="0" y1="500" x2="1920" y2="500" stroke="rgba(0, 212, 255, 0.1)" strokeWidth="2" />
            <line x1="0" y1="700" x2="1920" y2="700" stroke="rgba(0, 212, 255, 0.1)" strokeWidth="2" />
            <path d="M 0 200 Q 960 150 1920 300" stroke="rgba(0, 212, 255, 0.08)" strokeWidth="3" fill="none" />
            <path d="M 0 900 Q 960 950 1920 800" stroke="rgba(0, 212, 255, 0.08)" strokeWidth="3" fill="none" />
          </svg>

          <div className="logo-container">
            <LogoSVG />
            <div className="logo-text">NEXTGEN MOBILITY</div>
            <div className="tagline">Mobilidade Sustentável</div>
          </div>
        </div>

        <div className="slide-nav">
          <a href="index.html">← Voltar ao Índice</a>
        </div>

        <div className="slide-controls">
          <button onClick={() => window.location.href = 'index.html'}>← Índice</button>
          <button onClick={() => window.location.href = 'slide-02.html'}>Próximo →</button>
        </div>

        <div className="slide-counter">Slide 1 / 12</div>
      </>
    );
  }

  ReactDOM.render(<Slide />, document.getElementById('root'));
</script>

</body>
</html>
