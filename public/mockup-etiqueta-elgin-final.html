<title>Etiquetas Elgin — Mockup Final</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{background:#dcdcdc; font-family:Arial,Helvetica,sans-serif; display:flex; flex-direction:column; align-items:center; gap:36px; padding:40px 16px 80px;}
  .caption{font-size:12px; font-weight:700; color:#555; text-transform:uppercase; letter-spacing:0.08em;}
  .label{position:relative; background:#FFE500; box-shadow:0 8px 24px rgba(0,0,0,0.25); border-radius:2px;}
  .cell-el{position:absolute; color:#141400; font-weight:700; line-height:1.05; overflow:hidden; white-space:nowrap; text-overflow:ellipsis;}
  .cell-el.nome{font-weight:800;}
  .cell-el.ref{font-family:'Courier New',monospace; font-weight:700; color:#3c3c3c;}
  .cell-el.preco{font-weight:800; text-align:right; line-height:0.85;}
  .cell-el.barcode{display:flex; flex-direction:column; white-space:normal;}
  .bc-img{flex:1 1 auto; width:100%; min-height:0; object-fit:fill;}
  .bc-num{font-family:'Courier New',monospace; font-weight:700; color:#3c3c3c; text-align:center; flex-shrink:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .cut-line{position:absolute; top:0; bottom:0; width:0; border-left:2px dashed rgba(20,20,0,0.5);}
</style>

<div class="caption">Etiqueta Inteira — 105 × 28mm</div>
<div id="full" class="label"></div>

<div class="caption">Etiqueta Metade — 105 × 28mm (2 produtos independentes)</div>
<div id="half" class="label"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<script>
(function () {
  var SCALE = 8; // px por mm
  var W_MM = 105, H_MM = 28, HALF_OFFSET = 52.5;

  var FULL_LAYOUT = {
    nome:    { x: 3,    y: 2.9,  w: 81,   h: 4.1  },
    ref:     { x: 3,    y: 7.4,  w: 34,   h: 2.5  },
    barcode: { x: 3,    y: 12.7, w: 49,   h: 12.4 },
    rs:      { x: 60.3, y: 11.8, w: 5,    h: 4.5  },
    preco:   { x: 65.6, y: 11.8, w: 35.3, h: 13.4 },
  };
  var HALF_LAYOUT = {
    nome:    { x: 3,    y: 4,    w: 46,  h: 2.7 },
    ref:     { x: 3,    y: 7.4,  w: 21,  h: 2   },
    barcode: { x: 3,    y: 15.8, w: 21,  h: 9.3 },
    rs:      { x: 24.7, y: 15.1, w: 3.5, h: 3   },
    preco:   { x: 28.5, y: 15.1, w: 21,  h: 10  },
  };

  function productRef(p) {
    if (p.sku) return p.sku;
    if (p.ean) return String(p.ean).slice(-4);
    return '0000';
  }
  function formatPriceValue(v) {
    return v.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  var fitCanvas = document.createElement('canvas');
  function fitFontSize(text, maxWidthMm, maxHeightMm, weight, family) {
    if (!text) return maxHeightMm;
    var ctx = fitCanvas.getContext('2d');
    var probe = 100;
    ctx.font = weight + ' ' + probe + 'px ' + family;
    var measured = ctx.measureText(text).width || probe;
    return Math.max(1, Math.min(maxWidthMm * (probe / measured), maxHeightMm));
  }

  function barcodeDataUrl(code) {
    var c = document.createElement('canvas');
    JsBarcode(c, code, { format: 'CODE128', displayValue: false, width: 1.5, height: 50, margin: 0, background: 'transparent' });
    return c.toDataURL('image/png');
  }

  function boxStyle(p, offsetX) {
    return 'left:' + ((p.x + offsetX) * SCALE) + 'px; top:' + (p.y * SCALE) + 'px; width:' + (p.w * SCALE) + 'px; height:' + (p.h * SCALE) + 'px;';
  }

  function buildCellHtml(product, layout, offsetX) {
    var code = product.ean || product.sku || '';
    var bcDataUrl = code ? barcodeDataUrl(code) : '';
    var nomeText = product.name || '—';
    var refText = 'REF ' + productRef(product);
    var priceText = formatPriceValue(product.price || 0);

    var nomeMaxH = Math.max(1, layout.ref.y - layout.nome.y - 0.3);
    var nomeSize = fitFontSize(nomeText, layout.nome.w, nomeMaxH, 800, 'Arial, Helvetica, sans-serif') * SCALE;
    var refSize = fitFontSize(refText, layout.ref.w, layout.ref.h, 700, "'Courier New', monospace") * SCALE;
    var rsSize = fitFontSize('R$', layout.rs.w, layout.rs.h, 800, 'Arial, Helvetica, sans-serif') * SCALE;
    var precoSize = fitFontSize(priceText, layout.preco.w, layout.preco.h, 800, 'Arial, Helvetica, sans-serif') * SCALE;
    var bcNumSize = code ? fitFontSize(code, layout.barcode.w, layout.barcode.h * 0.3, 700, "'Courier New', monospace") * SCALE : 0;

    var html = '';
    html += '<div class="cell-el nome" style="' + boxStyle(layout.nome, offsetX) + 'font-size:' + nomeSize + 'px;">' + nomeText + '</div>';
    html += '<div class="cell-el ref" style="' + boxStyle(layout.ref, offsetX) + 'font-size:' + refSize + 'px;">' + refText + '</div>';
    html += '<div class="cell-el barcode" style="' + boxStyle(layout.barcode, offsetX) + '">';
    if (bcDataUrl) html += '<img class="bc-img" src="' + bcDataUrl + '" />';
    if (code) html += '<div class="bc-num" style="font-size:' + bcNumSize + 'px;">' + code + '</div>';
    html += '</div>';
    html += '<div class="cell-el rs" style="' + boxStyle(layout.rs, offsetX) + 'font-size:' + rsSize + 'px;">R$</div>';
    html += '<div class="cell-el preco" style="' + boxStyle(layout.preco, offsetX) + 'font-size:' + precoSize + 'px;">' + priceText + '</div>';
    return html;
  }

  var fullEl = document.getElementById('full');
  fullEl.style.width = (W_MM * SCALE) + 'px';
  fullEl.style.height = (H_MM * SCALE) + 'px';
  fullEl.innerHTML = buildCellHtml(
    { name: 'Refrigerante Cola Lata 350ml', sku: '0142', ean: '7891234567890', price: 5.49 },
    FULL_LAYOUT, 0
  );

  var halfEl = document.getElementById('half');
  halfEl.style.width = (W_MM * SCALE) + 'px';
  halfEl.style.height = (H_MM * SCALE) + 'px';
  halfEl.innerHTML =
    buildCellHtml({ name: 'Água Tônica Rosé 220ml', sku: '4600', ean: '7891234512345', price: 3.29 }, HALF_LAYOUT, 0) +
    buildCellHtml({ name: 'Cerveja Puro Malte 350ml', sku: '2871', ean: '7891234598765', price: 6.9 }, HALF_LAYOUT, HALF_OFFSET) +
    '<div class="cut-line" style="left:' + (W_MM / 2 * SCALE) + 'px;"></div>';
})();
</script>
