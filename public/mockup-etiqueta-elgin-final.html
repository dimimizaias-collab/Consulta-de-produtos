<title>Etiquetas Elgin — Mockup Final</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{background:#dcdcdc; font-family:Arial,Helvetica,sans-serif; display:flex; flex-direction:column; align-items:center; gap:36px; padding:40px 16px 80px;}
  .caption{font-size:12px; font-weight:700; color:#555; text-transform:uppercase; letter-spacing:0.08em;}
  .label{position:relative; background:#FFE500; box-shadow:0 8px 24px rgba(0,0,0,0.25); border-radius:2px;}
  .cell-el{position:absolute; color:#141400; font-weight:700; line-height:1.05; overflow:hidden; white-space:nowrap; text-overflow:ellipsis;}
  .cell-el.nome{font-weight:800;}
  .cell-el.ref{font-family:'Courier New',monospace; font-weight:700; color:#3c3c3c;}
  .cell-el.rs{display:flex; align-items:flex-start; justify-content:flex-end;}
  .cell-el.preco{font-weight:800; line-height:0.85; display:flex; align-items:center; justify-content:flex-end;}
  .cell-el.barcode{display:flex; flex-direction:column; white-space:normal;}
  .bc-img{flex:1 1 auto; width:100%; min-height:0; object-fit:fill;}
  .bc-num{font-family:'Courier New',monospace; font-weight:700; color:#3c3c3c; text-align:center; flex-shrink:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .cut-line{position:absolute; top:0; bottom:0; width:0; border-left:2px dashed rgba(20,20,0,0.5);}
</style>

<div class="caption">Etiqueta Inteira — 105 × 28mm</div>
<div id="full" class="label"></div>

<div class="caption">Etiqueta Inteira — nome longo (2 linhas) + preço grande</div>
<div id="full-long" class="label"></div>

<div class="caption">Etiqueta Metade — 105 × 28mm (2 produtos independentes, um com nome longo)</div>
<div id="half" class="label"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<script>
(function () {
  var SCALE = 8; // px por mm
  var W_MM = 105, H_MM = 28, HALF_OFFSET = 52.5;
  var NOME_GAP_MM = 0.3, NOME_MIN_TOP_MM = 1.3;
  var FIT_SAFETY = 0.94;

  var FULL_LAYOUT = {
    nome:    { x: 3,    y: 2.9,  w: 99,   h: 4.1  },
    ref:     { x: 3,    y: 8.2,  w: 34,   h: 2.5  },
    barcode: { x: 3,    y: 12.7, w: 49,   h: 12.4 },
    rs:      { x: 60.3, y: 11.8, w: 5,    h: 4.5  },
    preco:   { x: 65.6, y: 11.8, w: 35.3, h: 13.4 },
  };
  var HALF_LAYOUT = {
    nome:    { x: 3,    y: 1,    w: 46,  h: 2.7 },
    ref:     { x: 3,    y: 5.2,  w: 21,  h: 2   },
    barcode: { x: 3,    y: 12.8, w: 21,  h: 9.3 },
    rs:      { x: 24.7, y: 12.1, w: 3.5, h: 3   },
    preco:   { x: 28.5, y: 12.1, w: 21,  h: 10  },
  };

  function productRef(p) {
    if (p.sku) return p.sku;
    if (p.ean) return String(p.ean).slice(-4);
    return '0000';
  }
  function formatPriceValue(v) {
    return v.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  var fitCanvas = document.createElement('canvas');
  function fitFontSize(text, maxWidthMm, maxHeightMm, weight, family) {
    if (!text) return maxHeightMm;
    var ctx = fitCanvas.getContext('2d');
    var probe = 100;
    ctx.font = weight + ' ' + probe + 'px ' + family;
    var measured = ctx.measureText(text).width || probe;
    return Math.max(1, Math.min(maxWidthMm * FIT_SAFETY * (probe / measured), maxHeightMm));
  }

  function fitNomeLayout(text, layout, weight, family) {
    var w = layout.nome.w, y = layout.nome.y, refY = layout.ref.y;
    var singleMaxH = Math.max(1, refY - y - NOME_GAP_MM);
    var oneLineSize = fitFontSize(text, w, singleMaxH, weight, family);

    var bottom = refY - NOME_GAP_MM;
    var maxAvailableH = Math.max(singleMaxH, bottom - NOME_MIN_TOP_MM);
    var twoLineEstimate = fitFontSize(text, w * 1.85, 9999, weight, family);
    var heightCap = maxAvailableH / (2 * 1.05);
    var twoLineSize = Math.max(1, Math.min(twoLineEstimate, heightCap));

    if (twoLineSize > oneLineSize * 1.05) {
      var blockH = twoLineSize * 1.05 * 2;
      var yMm = Math.max(NOME_MIN_TOP_MM, bottom - blockH);
      return { fontSizeMm: twoLineSize, yMm: yMm, hMm: blockH, twoLines: true };
    }
    return { fontSizeMm: oneLineSize, yMm: y, hMm: singleMaxH, twoLines: false };
  }

  function barcodeDataUrl(code) {
    var c = document.createElement('canvas');
    JsBarcode(c, code, { format: 'CODE128', displayValue: false, width: 1.5, height: 50, margin: 0, background: 'transparent' });
    return c.toDataURL('image/png');
  }

  function boxStyle(x, y, w, h, offsetX) {
    return 'left:' + ((x + offsetX) * SCALE) + 'px; top:' + (y * SCALE) + 'px; width:' + (w * SCALE) + 'px; height:' + (h * SCALE) + 'px;';
  }

  function buildCellHtml(product, layout, offsetX) {
    var code = product.ean || product.sku || '';
    var bcDataUrl = code ? barcodeDataUrl(code) : '';
    var nomeText = product.name || '—';
    var refText = 'REF ' + productRef(product);
    var priceText = formatPriceValue(product.price || 0);

    var nomeFit = fitNomeLayout(nomeText, layout, 800, 'Arial, Helvetica, sans-serif');
    var refSize = fitFontSize(refText, layout.ref.w, layout.ref.h, 700, "'Courier New', monospace") * SCALE;
    var rsSize = fitFontSize('R$', layout.rs.w, layout.rs.h, 800, 'Arial, Helvetica, sans-serif') * SCALE;
    var precoSize = fitFontSize(priceText, layout.preco.w, layout.preco.h, 800, 'Arial, Helvetica, sans-serif') * SCALE;
    var bcNumSize = code ? fitFontSize(code, layout.barcode.w, layout.barcode.h * 0.3, 700, "'Courier New', monospace") * SCALE : 0;

    var nomeWrap = nomeFit.twoLines
      ? 'white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;'
      : '';

    var html = '';
    html += '<div class="cell-el nome" style="' + boxStyle(layout.nome.x, nomeFit.yMm, layout.nome.w, nomeFit.hMm, offsetX) + 'font-size:' + (nomeFit.fontSizeMm * SCALE) + 'px;' + nomeWrap + '">' + nomeText + '</div>';
    html += '<div class="cell-el ref" style="' + boxStyle(layout.ref.x, layout.ref.y, layout.ref.w, layout.ref.h, offsetX) + 'font-size:' + refSize + 'px;">' + refText + '</div>';
    html += '<div class="cell-el barcode" style="' + boxStyle(layout.barcode.x, layout.barcode.y, layout.barcode.w, layout.barcode.h, offsetX) + '">';
    if (bcDataUrl) html += '<img class="bc-img" src="' + bcDataUrl + '" />';
    if (code) html += '<div class="bc-num" style="font-size:' + bcNumSize + 'px;">' + code + '</div>';
    html += '</div>';
    html += '<div class="cell-el rs" style="' + boxStyle(layout.rs.x, layout.rs.y, layout.rs.w, layout.rs.h, offsetX) + 'font-size:' + rsSize + 'px;">R$</div>';
    html += '<div class="cell-el preco" style="' + boxStyle(layout.preco.x, layout.preco.y, layout.preco.w, layout.preco.h, offsetX) + 'font-size:' + precoSize + 'px;">' + priceText + '</div>';
    return html;
  }

  function mount(id, w) {
    var el = document.getElementById(id);
    el.style.width = (W_MM * SCALE) + 'px';
    el.style.height = (H_MM * SCALE) + 'px';
    return el;
  }

  mount('full').innerHTML = buildCellHtml(
    { name: 'Refrigerante Cola Lata 350ml', sku: '0142', ean: '7891234567890', price: 5.49 },
    FULL_LAYOUT, 0
  );

  mount('full-long').innerHTML = buildCellHtml(
    { name: 'porta sabao liquido fiat preto 500ml nitron', sku: '5328', ean: '7896779655328', price: 12 },
    FULL_LAYOUT, 0
  );

  var halfEl = mount('half');
  halfEl.innerHTML =
    buildCellHtml({ name: 'porta oleo italia preto nitron', sku: '6012', ean: '7996779646012', price: 10 }, HALF_LAYOUT, 0) +
    buildCellHtml({ name: 'porta oleo italia preto nitron', sku: '6012', ean: '7996779646012', price: 10 }, HALF_LAYOUT, HALF_OFFSET) +
    '<div class="cut-line" style="left:' + (W_MM / 2 * SCALE) + 'px;"></div>';
})();
</script>
