<!doctype html>
<html lang="pt-BR" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fluxo de Caixa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFFCEC; --text: #1A1A0E; --muted: rgba(26,26,10,0.45); --faint: rgba(26,26,10,0.28); --ghost: rgba(26,26,10,0.18);
    --hdr: #FBF35E; --hdr-border: #D9CF45; --hdr-text: #1A1A0E; --chip: rgba(26,26,10,0.09);
    --card: #FFFFFF; --card-border: #E0D8BF; --field: #FDFAF0; --field-hover: #CFC4A2;
    --line: #EFE8D2; --soft: #FAF7EE; --sub: #FDFBF4;
    --menu: #FFFFFF; --menu-hover: #FFF8D0;
    --grid: #A8A290; --row-hover: #FFF8D0; --th: #FFEC4D; --th-line: #B8A31F; --th-bottom: #8F7E10; --th-text: rgba(26,26,10,0.55); --th-on: #FFE014;
    --total: #FFF8D0; --total-strong: rgba(255,236,77,0.6); --colsel: rgba(255,243,163,0.5);
    --tabshadow: inset 0 6px 8px -5px rgba(26,26,10,0.35);
    --green: #1F8A4C; --red: #D81E1E; --amber: #B45309; --amber-bg: #FFFBEB; --amber-border: rgba(251,191,36,0.55);
    --drop: rgba(216,30,30,0.05);
    --rail: 64px; --hh: 44px;
  }
  html.dark {
    --bg: #161612; --text: #F2F0E3; --muted: rgba(242,240,227,0.42); --faint: rgba(242,240,227,0.25); --ghost: rgba(242,240,227,0.16);
    --hdr: #252520; --hdr-border: rgba(242,240,227,0.08); --hdr-text: #F2F0E3; --chip: rgba(216,30,30,0.13);
    --card: #1E1E18; --card-border: rgba(242,240,227,0.10); --field: #252520; --field-hover: rgba(242,240,227,0.20);
    --line: rgba(242,240,227,0.06); --soft: #1A1A15; --sub: #1B1B16;
    --menu: #2E2E28; --menu-hover: rgba(255,229,0,0.08);
    --grid: rgba(242,240,227,0.20); --row-hover: rgba(255,229,0,0.06); --th-text: rgba(26,26,10,0.58);
    --total: rgba(255,229,0,0.05); --total-strong: rgba(255,229,0,0.12); --colsel: rgba(255,229,0,0.07);
    --tabshadow: inset 0 6px 8px -5px rgba(0,0,0,0.55);
    --green: #4ADE80; --amber: #FBBF24; --amber-bg: rgba(251,191,36,0.07); --amber-border: rgba(251,191,36,0.40);
    --drop: rgba(216,30,30,0.10);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; padding-bottom: 80px; }
  button, select { font-family: inherit; }
  .mono { font-family: 'DM Mono', monospace; font-variant-numeric: tabular-nums; }

  .anno { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 100; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: center; padding: 8px 10px; border-radius: 14px; background: #1A1A0E; color: #F2F0E3; font-size: 12px; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,.35); max-width: calc(100vw - 24px); }
  .anno b { color: #FFE500; margin-right: 4px; }
  .anno button { border: 1px solid rgba(242,240,227,.18); background: transparent; color: #F2F0E3; padding: 5px 10px; border-radius: 999px; cursor: pointer; font-weight: 700; font-size: 11px; }
  .anno button.on { background: #FFE500; color: #1A1A0E; border-color: #FFE500; }
  .anno a { color: rgba(242,240,227,.6); font-size: 11px; margin-left: 4px; }

  /* Shell */
  .hdr { position: fixed; top: 0; left: 0; right: 0; z-index: 50; height: var(--hh); display: flex; align-items: stretch; background: var(--hdr); border-bottom: 1px solid var(--hdr-border); }
  .logo { width: var(--rail); display: grid; place-items: center; border-right: 1px solid var(--hdr-border); }
  .logo span { width: 32px; height: 32px; display: grid; place-items: center; background: #fff; color: #D81E1E; font-size: 8.5px; font-weight: 900; border: 1px solid rgba(26,26,10,0.12); }
  .ttl { display: flex; align-items: center; gap: 9px; padding: 0 16px; }
  .ico { width: 28px; height: 28px; display: grid; place-items: center; background: var(--chip); color: var(--hdr-text); }
  html.dark .ico { color: #D81E1E; }
  .ttl h1 { margin: 0; font-size: 15px; font-weight: 900; color: var(--hdr-text); }
  .pbtn { margin: auto 10px auto auto; width: 30px; height: 30px; display: grid; place-items: center; border: 1px solid rgba(26,26,10,0.16); background: rgba(26,26,10,0.06); color: var(--hdr-text); font-size: 11.5px; font-weight: 900; }
  html.dark .pbtn { border-color: rgba(242,240,227,0.14); background: rgba(216,30,30,0.13); }
  .rail { position: fixed; left: 0; top: var(--hh); bottom: 0; width: var(--rail); z-index: 45; background: var(--hdr); border-right: 1px solid var(--hdr-border); display: flex; flex-direction: column; align-items: center; padding: 8px 0; gap: 4px; }
  .nav { width: 48px; height: 44px; display: grid; place-items: center; color: var(--hdr-text); opacity: .6; }
  .nav.on { opacity: 1; background: #D81E1E; color: #fff; }
  main { margin-left: var(--rail); padding-top: var(--hh); }

  .tabs { position: sticky; top: var(--hh); z-index: 20; display: flex; background: var(--bg); width: max-content; }
  .tab { height: 32px; min-width: 120px; padding: 0 14px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--hdr-border); border-top: 0; margin-left: -1px; background: var(--hdr); color: var(--hdr-text); font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; box-shadow: var(--tabshadow); cursor: pointer; }
  .tab:first-child { margin-left: 0; border-left: 0; }
  .tab span { opacity: .55; }
  .tab.on { box-shadow: var(--tabshadow), inset 0 -3px 0 #D81E1E; }
  .tab.on span { opacity: 1; }
  .tab .new { margin-left: 6px; font-size: 8px; padding: 1px 4px; background: #D81E1E; color: #fff; letter-spacing: .04em; opacity: 1; }

  .wrap { padding: 12px 28px 20px; display: flex; flex-direction: column; gap: 10px; }

  /* Toolbar */
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .seg { display: flex; border: 1px solid var(--card-border); background: var(--card); }
  .seg button { height: 26px; padding: 0 10px; border: 0; background: transparent; color: var(--muted); font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: color .15s, background .15s; white-space: nowrap; }
  .seg button + button { border-left: 1px solid var(--card-border); }
  .seg button:hover { color: var(--text); }
  .seg button.on { background: #D81E1E; color: #fff; }
  .seg button:active { transform: scale(.97); }
  .seg .cnt { font-size: 9px; font-weight: 900; padding: 0 5px; line-height: 15px; border-radius: 999px; background: rgba(251,191,36,0.3); color: var(--amber); letter-spacing: 0; }
  .seg button.on .cnt { background: rgba(255,255,255,.25); color: #fff; }
  .year { display: flex; align-items: center; border: 1px solid var(--card-border); background: var(--card); }
  .year button { width: 28px; height: 26px; border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 13px; font-weight: 900; }
  .year span { height: 26px; padding: 0 10px; display: grid; place-items: center; border-left: 1px solid var(--card-border); border-right: 1px solid var(--card-border); font-size: 12px; font-weight: 900; }
  .chipsel { height: 28px; display: flex; align-items: center; gap: 6px; padding: 0 10px; border: 1px solid rgba(216,30,30,.4); background: rgba(216,30,30,.06); color: #D81E1E; font-size: 11px; font-weight: 800; cursor: pointer; }
  .vsep { width: 1px; height: 20px; background: var(--card-border); margin: 0 4px; }
  .ml { margin-left: auto; }
  .hint { font-size: 11px; color: var(--faint); font-weight: 600; }

  /* KPIs */
  .kpis { display: grid; grid-template-columns: repeat(6, 1fr); border-left: 1px solid var(--card-border); border-top: 1px solid var(--card-border); background: var(--card); }
  .kpi { padding: 10px 12px; border-right: 1px solid var(--card-border); border-bottom: 1px solid var(--card-border); }
  .kpi .l { font-size: 9px; font-weight: 900; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
  .kpi .l i { font-style: normal; color: var(--faint); }
  .kpi .v { margin-top: 2px; font-size: 16px; font-weight: 900; }
  .kpi .s { font-size: 10.5px; font-weight: 800; color: #D81E1E; margin-top: 1px; }
  .kpi .bar2 { height: 3px; margin-top: 7px; background: var(--line); position: relative; }
  .kpi .bar2 b { position: absolute; left: 0; top: 0; bottom: 0; }

  .warn { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border: 1px solid var(--amber-border); background: var(--amber-bg); color: var(--amber); font-size: 12px; cursor: pointer; }
  .warn b { font-weight: 900; }
  .warn u { margin-left: auto; font-weight: 800; text-decoration: none; text-transform: uppercase; font-size: 10.5px; letter-spacing: .05em; }

  /* DRE table */
  .tbl { background: var(--card); border: 1px solid var(--card-border); overflow-x: auto; }
  table { width: 100%; min-width: 1320px; table-layout: fixed; border-collapse: collapse; font-size: 13px; }
  th { height: 32px; padding: 0 10px; background: var(--th); text-align: right; box-shadow: inset -1px 0 0 var(--th-line), inset 0 -1.5px 0 var(--th-bottom); font-size: 9px; font-weight: 900; text-transform: uppercase; letter-spacing: .1em; color: var(--th-text); white-space: nowrap; }
  th:first-child { text-align: left; position: sticky; left: 0; z-index: 2; }
  th.m { cursor: pointer; } th.m:hover { color: #1A1A0E; }
  th.on { background: var(--th-on); color: #1A1A0E; }
  th .now { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: #D81E1E; margin-right: 4px; vertical-align: 1px; }
  th.tot { color: #1A1A0E; }
  td { height: 36px; padding: 0 10px; border-right: 1px solid var(--grid); border-bottom: 1px solid var(--grid); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; }
  td:last-child { border-right: 0; background-color: var(--soft); font-weight: 800; }
  td:first-child { text-align: left; position: sticky; left: 0; z-index: 1; background: inherit; }
  td.sel { background-color: var(--colsel); }
  tr { background: var(--card); }
  tr.g { cursor: pointer; transition: background .12s; } tr.g:hover { background: var(--row-hover); }
  tr.sub { background: var(--sub); }
  tr.t { background: var(--total); }
  tr.t.strong { background: var(--total-strong); }
  tr.alt { background: var(--soft); }
  .v { font-family: 'DM Mono', monospace; font-variant-numeric: tabular-nums; font-size: 12px; }
  .z { color: var(--ghost); }
  .pos { color: var(--green); } .neg { color: var(--red); }
  .lbl { display: flex; align-items: center; gap: 6px; }
  .chev { width: 12px; font-size: 9px; color: var(--muted); transition: transform .18s cubic-bezier(.23,1,.32,1); display: inline-block; text-align: center; }
  .chev.open { transform: rotate(90deg); }
  .sg { width: 12px; text-align: center; font-weight: 900; }
  .gname { font-weight: 800; }
  .gname.nc { color: var(--amber); }
  .tlbl { font-weight: 900; text-transform: uppercase; letter-spacing: .04em; font-size: 11.5px; }
  tr.strong .tlbl { font-size: 12px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .sq { width: 7px; height: 7px; border: 1px solid var(--faint); flex-shrink: 0; }
  .stag { padding-left: 42px; font-size: 12px; color: var(--muted); }
  .stag em { color: var(--faint); }
  .meta { padding-left: 38px; font-size: 11.5px; font-weight: 700; color: var(--muted); }
  .foot { font-size: 10.5px; color: var(--faint); padding: 0 2px; }
  .openpill { display: inline-block; font-size: 8.5px; font-weight: 900; padding: 0 4px; line-height: 13px; margin-left: 4px; border: 1px solid var(--amber-border); color: var(--amber); letter-spacing: .04em; vertical-align: 1px; }

  /* Tag groups board */
  .intro { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; background: var(--card); border: 1px solid var(--card-border); padding: 10px 14px; }
  .intro p { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.5; }
  .intro p b { color: var(--text); }
  .prog { display: flex; align-items: center; gap: 10px; }
  .prog .track { width: 160px; height: 6px; background: var(--line); }
  .prog .track b { display: block; height: 100%; background: #D81E1E; transition: width .3s cubic-bezier(.23,1,.32,1); }
  .prog span { font-size: 11px; font-weight: 800; color: var(--muted); white-space: nowrap; }
  .search { height: 28px; width: 240px; border: 1px solid var(--card-border); background: var(--card); padding: 0 10px; font-size: 12px; font-weight: 600; color: var(--text); outline: none; font-family: inherit; }
  .search:focus { border-color: #D81E1E; }
  .board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .col { background: var(--card); border: 1px solid var(--card-border); display: flex; flex-direction: column; min-height: 168px; transition: border-color .15s, background .15s; }
  .col.over { border-color: #D81E1E; background: var(--drop); }
  .col.none { border-color: var(--amber-border); }
  .col.none .ch { background: var(--amber-bg); }
  .col.none .ch .n { color: var(--amber); }
  .ch { display: flex; align-items: center; gap: 7px; height: 34px; padding: 0 10px; background: var(--th); box-shadow: inset 0 -1.5px 0 var(--th-bottom); }
  .ch .s { font-weight: 900; font-size: 13px; width: 12px; text-align: center; }
  .ch .n { font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: .08em; color: #1A1A0E; }
  .ch .c { margin-left: auto; font-size: 9px; font-weight: 900; padding: 0 5px; line-height: 15px; border-radius: 999px; background: rgba(26,26,10,.12); color: #1A1A0E; }
  .col.none .ch .c { background: rgba(251,191,36,.3); color: var(--amber); }
  .cd { padding: 6px 10px; font-size: 10.5px; color: var(--faint); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; }
  .cd b { color: var(--muted); font-family: 'DM Mono', monospace; font-weight: 500; }
  .cards { padding: 6px; display: flex; flex-direction: column; gap: 5px; flex: 1; }
  .empty { flex: 1; display: grid; place-items: center; border: 1.5px dashed var(--card-border); color: var(--faint); font-size: 11px; font-weight: 700; min-height: 56px; }
  .tc { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 6px 0 8px; border: 1px solid var(--card-border); background: var(--field); cursor: grab; position: relative; transition: border-color .12s, transform .15s, box-shadow .15s, opacity .15s; }
  .tc:hover { border-color: var(--field-hover); }
  .tc.drag { opacity: .4; }
  .tc.flash { animation: flash .9s cubic-bezier(.23,1,.32,1); }
  @keyframes flash { 0% { box-shadow: 0 0 0 3px rgba(216,30,30,.35); } 100% { box-shadow: 0 0 0 0 rgba(216,30,30,0); } }
  .grip { color: var(--ghost); font-size: 10px; letter-spacing: -2px; }
  .tc .nm { flex: 1; min-width: 0; font-size: 12.5px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tc .lock { font-size: 8px; font-weight: 900; padding: 0 4px; line-height: 13px; border: 1px solid var(--card-border); color: var(--faint); letter-spacing: .04em; }
  .tc .us { font-size: 10px; color: var(--faint); text-align: right; line-height: 1.15; }
  .tc .us b { display: block; font-family: 'DM Mono', monospace; font-weight: 500; color: var(--muted); font-size: 10.5px; }
  .mv { width: 24px; height: 24px; border: 0; background: transparent; color: var(--faint); cursor: pointer; font-size: 14px; font-weight: 900; display: grid; place-items: center; }
  .mv:hover { background: var(--menu-hover); color: var(--text); }
  .menu { position: absolute; right: 4px; top: 36px; z-index: 30; width: 190px; background: var(--menu); border: 1px solid var(--card-border); box-shadow: 0 12px 28px rgba(26,26,10,.18); padding: 4px; transform-origin: top right; animation: pop .13s cubic-bezier(.23,1,.32,1); }
  @keyframes pop { from { opacity: 0; transform: scale(.97) translateY(-4px); } }
  .menu .mh { font-size: 9px; font-weight: 900; text-transform: uppercase; letter-spacing: .1em; color: var(--faint); padding: 5px 8px 4px; }
  .menu button { width: 100%; display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 8px; border: 0; background: transparent; color: var(--text); font-size: 12px; font-weight: 700; cursor: pointer; text-align: left; }
  .menu button:hover { background: var(--menu-hover); }
  .menu button.cur { color: #D81E1E; }
  .menu button .s { width: 12px; text-align: center; font-weight: 900; }
  .toast { position: fixed; right: 20px; bottom: 76px; z-index: 90; background: #1A1A0E; color: #F2F0E3; padding: 10px 14px; font-size: 12px; font-weight: 600; display: flex; gap: 12px; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,.3); animation: pop .2s cubic-bezier(.23,1,.32,1); }
  .toast button { border: 0; background: transparent; color: #FFE500; font-weight: 900; text-transform: uppercase; font-size: 10.5px; letter-spacing: .05em; cursor: pointer; }
  .rules { display: grid; grid-template-columns: repeat(3, 1fr); border-left: 1px solid var(--card-border); border-top: 1px solid var(--card-border); background: var(--card); }
  .rules div { padding: 10px 12px; border-right: 1px solid var(--card-border); border-bottom: 1px solid var(--card-border); font-size: 11.5px; color: var(--muted); line-height: 1.45; }
  .rules b { display: block; font-size: 9px; font-weight: 900; text-transform: uppercase; letter-spacing: .1em; color: var(--text); margin-bottom: 3px; }
</style>
</head>
<body>
  <header class="hdr">
    <div class="logo"><span>CR</span></div>
    <div class="ttl"><div class="ico"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="2" y="6" width="20" height="13" rx="1"/><circle cx="12" cy="12.5" r="2.5"/></svg></div><h1>Controle Financeiro</h1></div>
    <div class="pbtn">DM</div>
  </header>
  <nav class="rail">
    <div class="nav"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 10l9-7 9 7v10H3z"/></svg></div>
    <div class="nav"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/></svg></div>
    <div class="nav on"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="2" y="6" width="20" height="13"/><circle cx="12" cy="12.5" r="2.5"/></svg></div>
    <div class="nav"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="9" cy="8" r="3.5"/><path d="M2 20c1-4 4-6 7-6s6 2 7 6"/></svg></div>
  </nav>

  <main>
    <div class="tabs">
      <div class="tab"><span>Controle Financeiro</span></div>
      <div class="tab on"><span>Fluxo de Caixa</span><span class="new">NOVO</span></div>
      <div class="tab"><span>Favorecidos</span></div>
      <div class="tab"><span>Contas</span></div>
    </div>
    <div class="wrap" id="app"></div>
  </main>

  <div class="anno" id="anno"></div>

<script>
const MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const HOJE_MES = 9; // Outubro/2026
const GRUPOS = [
  { k: 'receita',          n: 'Receitas',            s: '+', d: 'Vendas e entradas' },
  { k: 'custo_variavel',   n: 'Custos variáveis',    s: '−', d: 'Acompanham as vendas' },
  { k: 'custo_fixo',       n: 'Custos fixos',        s: '−', d: 'Da operação, todo mês' },
  { k: 'despesa_variavel', n: 'Despesas variáveis',  s: '−', d: 'Sem valor ou data fixos' },
  { k: 'despesa_fixa',     n: 'Despesas fixas',      s: '−', d: 'Recorrentes, todo mês' },
  { k: 'investimento',     n: 'Investimentos',       s: '−', d: 'Abaixo do resultado' },
  { k: 'ignorar',          n: 'Fora do fluxo',       s: '∅', d: 'Não entram no relatório' },
];
const GN = Object.fromEntries(GRUPOS.map(g => [g.k, g]));
GN.nao_classificado = { k: 'nao_classificado', n: 'Despesas não classificadas', s: '−' };

// tag: nome, cor, grupo, valor mensal base, nº movimentações, tipo
let TAGS = [
  { id: 'vendas',  nome: 'Vendas Balcão',      cor: '#22c55e', g: 'receita',          base: 182000, n: 312, tipo: 'R' },
  { id: 'ifood',   nome: 'Vendas Delivery',    cor: '#14b8a6', g: 'receita',          base: 24000,  n: 96,  tipo: 'R' },
  { id: 'forn',    nome: 'Fornecedor',         cor: '#3b82f6', g: 'custo_variavel',   base: 104000, n: 488, tipo: 'D' },
  { id: 'frete',   nome: 'Frete',              cor: '#8b5cf6', g: 'custo_variavel',   base: 6200,   n: 74,  tipo: 'D' },
  { id: 'embal',   nome: 'Embalagens',         cor: '#f59e0b', g: 'custo_variavel',   base: 2900,   n: 41,  tipo: 'D' },
  { id: 'aluguel', nome: 'Aluguel do galpão',  cor: '#6b7280', g: 'custo_fixo',       base: 9500,   n: 10,  tipo: 'D' },
  { id: 'fixo',    nome: 'Fixo Mensal',        cor: '#8b5cf6', g: 'despesa_fixa',     base: 7400,   n: 88,  tipo: 'D' },
  { id: 'sal',     nome: 'Salários',           cor: '#ef4444', g: 'despesa_fixa',     base: 31000,  n: 140, tipo: 'D', lock: true },
  { id: 'energia', nome: 'Energia (CEMIG)',    cor: '#f59e0b', g: 'despesa_fixa',     base: 4300,   n: 10,  tipo: 'D' },
  { id: 'var',     nome: 'Variável',           cor: '#f59e0b', g: 'despesa_variavel', base: 3800,   n: 63,  tipo: 'D' },
  { id: 'imp',     nome: 'Imposto / Tributo',  cor: '#ef4444', g: 'despesa_variavel', base: 14600,  n: 52,  tipo: 'D' },
  { id: 'manut',   nome: 'Manutenção',         cor: '#6b7280', g: null,               base: 2100,   n: 23,  tipo: 'D' },
  { id: 'mkt',     nome: 'Marketing',          cor: '#ec4899', g: null,               base: 1700,   n: 18,  tipo: 'D' },
  { id: 'inv',     nome: 'Investimento',       cor: '#22c55e', g: 'investimento',     base: 5200,   n: 9,   tipo: 'D' },
  { id: 'transf',  nome: 'Transferência',      cor: '#6b7280', g: 'ignorar',          base: 15000,  n: 30,  tipo: 'D' },
];
const SEM_TAG_D = { id: 'semtag', nome: 'Sem tag', cor: null, base: 1300, tipo: 'D' };

// séries determinísticas
const sazon = [0.86, 0.82, 0.95, 0.93, 1.0, 0.97, 1.02, 1.04, 0.98, 1.06, 1.12, 1.34];
const wob = (i, j) => 1 + (((i * 7 + j * 13) % 9) - 4) / 60;
function serie(t, j) {
  const fixos = ['aluguel', 'energia', 'fixo', 'sal'];
  return MESES.map((_, i) => {
    const f = fixos.includes(t.id) ? 1 : sazon[i];
    let v = Math.round(t.base * f * wob(i, j));
    if (t.id === 'inv' && ![2, 6, 10].includes(i)) v = 0;
    // realizado / aberto
    let real, open;
    if (i < HOJE_MES - 1) { real = v; open = 0; }
    else if (i === HOJE_MES - 1) { real = Math.round(v * 0.94); open = v - real; } // set: um pouco vencido
    else if (i === HOJE_MES) { real = Math.round(v * (t.tipo === 'R' ? 0.18 : 0.12)); open = v - real; }
    else { real = 0; open = t.tipo === 'R' ? Math.round(v * 0.25) : (fixos.includes(t.id) || t.id === 'forn' || t.id === 'imp' ? v : Math.round(v * 0.4)); }
    return { real, open };
  });
}
let SER = {};
function rebuild() { SER = {}; [...TAGS, SEM_TAG_D].forEach((t, j) => SER[t.id] = serie(t, j)); }
rebuild();

const S = { view: 'dre', modo: 'previsto', mes: null, exp: new Set(), menu: null, q: '', toast: null, flash: null, warnHidden: false };
const fmt = v => Math.abs(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const brl = v => (v < 0 ? '−' : '') + 'R$ ' + fmt(v);
const pick = c => S.modo === 'realizado' ? c.real : S.modo === 'aberto' ? c.open : c.real + c.open;

function grupoDe(t) {
  if (t.id === 'semtag') return 'nao_classificado';
  if (t.g === 'ignorar') return null;
  if (t.tipo === 'R') return 'receita';
  return t.g && t.g !== 'receita' ? t.g : 'nao_classificado';
}
function calc() {
  const G = {}, L = {};
  [...GRUPOS.map(g => g.k), 'nao_classificado'].forEach(k => { G[k] = Array(13).fill(0); L[k] = []; });
  [...TAGS, SEM_TAG_D].forEach(t => {
    const g = grupoDe(t); if (!g) return;
    const s = SER[t.id].map(pick); s.push(s.reduce((a, b) => a + b, 0));
    if (!s[12]) return;
    s.forEach((v, i) => G[g][i] += v);
    L[g].push({ t, s });
  });
  Object.values(L).forEach(a => a.sort((x, y) => y.s[12] - x.s[12]));
  const comb = f => Array.from({ length: 13 }, (_, i) => f(i));
  const lb = comb(i => G.receita[i] - G.custo_variavel[i] - G.custo_fixo[i]);
  const ro = comb(i => lb[i] - G.despesa_variavel[i] - G.despesa_fixa[i] - G.nao_classificado[i]);
  const rp = comb(i => ro[i] - G.investimento[i]);
  const mg = comb(i => G.receita[i] ? rp[i] / G.receita[i] * 100 : NaN);
  let acc = 0; const ac = comb(i => i < 12 ? (acc += rp[i]) : acc);
  return { G, L, lb, ro, rp, mg, ac };
}
function kpis() {
  const k = { entrou: 0, saiu: 0, rec: 0, pag: 0, venc: 0 };
  [...TAGS, SEM_TAG_D].forEach(t => {
    if (t.g === 'ignorar') return;
    SER[t.id].forEach((c, i) => {
      if (S.mes !== null && i !== S.mes) return;
      if (t.tipo === 'R') { k.entrou += c.real; k.rec += c.open; }
      else { k.saiu += c.real; k.pag += c.open; if (i < HOJE_MES) k.venc += c.open; }
    });
  });
  return k;
}

function cell(v, i, opts = {}) {
  const sel = i === S.mes ? ' sel' : '';
  if (!v || Number.isNaN(v)) return `<td class="${sel}"><span class="z">—</span></td>`;
  const cls = opts.sinal ? (v < 0 ? 'neg' : 'pos') : '';
  return `<td class="${sel}"><span class="v ${cls}" style="${opts.forte ? 'font-weight:800' : ''}">${opts.sinal && v < 0 ? '−' : ''}${fmt(v)}</span></td>`;
}
function rowGrupo(k, R) {
  const g = GN[k], ls = R.L[k], open = S.exp.has(k);
  const sgCls = g.s === '+' ? 'pos' : 'neg';
  let h = `<tr class="g" onclick="tog('${k}')"><td><span class="lbl"><span class="chev ${open ? 'open' : ''}" style="${ls.length ? '' : 'opacity:0'}">▶</span><span class="sg ${sgCls}">${g.s}</span><span class="gname ${k === 'nao_classificado' ? 'nc' : ''}">${g.n}</span>${k === 'nao_classificado' ? '<span class="openpill">CLASSIFICAR</span>' : ''}</span></td>${R.G[k].map((v, i) => cell(v, i, { forte: i === 12 })).join('')}</tr>`;
  if (open) ls.forEach(({ t, s }) => {
    const mark = t.cor ? `<span class="dot" style="background:${t.cor}"></span>` : '<span class="sq"></span>';
    h += `<tr class="sub"><td><span class="lbl stag">${mark}${t.cor ? t.nome : '<em>Sem tag</em>'}</span></td>${s.map((v, i) => cell(v, i)).join('')}</tr>`;
  });
  return h;
}
function rowTotal(lbl, s, strong) {
  return `<tr class="t ${strong ? 'strong' : ''}"><td><span class="lbl" style="padding-left:18px"><span class="sg" style="color:var(--muted)">=</span><span class="tlbl">${lbl}</span></span></td>${s.map((v, i) => cell(v, i, { sinal: true, forte: true })).join('')}</tr>`;
}

function renderDRE() {
  const R = calc(), k = kpis();
  const scope = S.mes !== null ? `${MESES[S.mes]}/2026` : '2026';
  const semGrupo = TAGS.filter(t => !t.g).length;
  const tiles = [
    { l: 'Entrou', v: k.entrou, c: 'pos' },
    { l: 'Saiu', v: k.saiu, c: 'neg' },
    { l: 'Resultado realizado', v: k.entrou - k.saiu, c: k.entrou - k.saiu < 0 ? 'neg' : '' },
    { l: 'A receber', v: k.rec },
    { l: 'A pagar', v: k.pag, s: k.venc ? brl(k.venc) + ' vencido' : '' },
    { l: 'Resultado previsto', v: k.entrou + k.rec - k.saiu - k.pag, c: (k.entrou + k.rec - k.saiu - k.pag) < 0 ? 'neg' : '' },
  ];
  const modoLbl = { previsto: 'Previsto', realizado: 'Realizado', aberto: 'Em aberto' }[S.modo];
  const temInv = R.G.investimento[12] !== 0;
  const nc = R.G.nao_classificado[12];
  return `
    ${toolbar(semGrupo)}
    <div class="kpis">${tiles.map(t => `<div class="kpi"><div class="l">${t.l} <i>· ${scope}</i></div><div class="v mono ${t.c || ''}">${brl(t.v)}</div>${t.s ? `<div class="s">${t.s}</div>` : ''}</div>`).join('')}</div>
    ${nc > 0 && !S.warnHidden ? `<div class="warn" onclick="go('tags')"><span>⚠</span><span><b>${brl(nc)}</b> em despesas de 2026 sem grupo da DRE — ${semGrupo} tags sem grupo e movimentações sem tag.</span><u>Classificar tags →</u></div>` : ''}
    <div class="tbl"><table>
      <colgroup><col style="width:250px">${MESES.map(() => '<col>').join('')}<col style="width:116px"></colgroup>
      <thead><tr><th>${modoLbl} · 2026</th>${MESES.map((m, i) => `<th class="m ${i === S.mes ? 'on' : ''}" onclick="selMes(${i})">${i === HOJE_MES ? '<span class="now"></span>' : ''}${m}</th>`).join('')}<th class="tot">Total</th></tr></thead>
      <tbody>
        ${rowGrupo('receita', R)}
        ${rowGrupo('custo_variavel', R)}
        ${rowGrupo('custo_fixo', R)}
        ${rowTotal('Lucro bruto', R.lb)}
        ${rowGrupo('despesa_variavel', R)}
        ${rowGrupo('despesa_fixa', R)}
        ${nc ? rowGrupo('nao_classificado', R) : ''}
        ${rowTotal(temInv ? 'Resultado operacional' : 'Resultado do período', R.ro, !temInv)}
        ${temInv ? rowGrupo('investimento', R) + rowTotal('Resultado do período', R.rp, true) : ''}
        <tr><td><span class="meta">Margem sobre receitas</span></td>${R.mg.map((v, i) => `<td class="${i === S.mes ? 'sel' : ''}">${Number.isNaN(v) ? '<span class="z">—</span>' : `<span class="v ${v < 0 ? 'neg' : ''}" style="font-size:11.5px;color:${v < 0 ? '' : 'var(--muted)'}">${v.toLocaleString('pt-BR', { maximumFractionDigits: 1 })}%</span>`}</td>`).join('')}</tr>
        <tr class="alt"><td><span class="meta">Saldo acumulado no ano</span></td>${R.ac.map((v, i) => cell(v, i, { sinal: true })).join('')}</tr>
      </tbody>
    </table></div>
    <div class="foot">Pagos entram no mês do pagamento; em aberto, no mês do vencimento. Compras no cartão entram pelas tags de cada compra, no mês da fatura. Clique num grupo para abrir as tags e num mês para ver os indicadores dele.</div>`;
}

function toolbar(semGrupo) {
  return `<div class="bar">
    <div class="year"><button>‹</button><span>2026</span><button>›</button></div>
    <div class="seg">
      <button class="${S.view === 'dre' ? 'on' : ''}" onclick="go('dre')">DRE mensal</button>
      <button class="${S.view === 'tags' ? 'on' : ''}" onclick="go('tags')">Grupos das tags ${semGrupo ? `<span class="cnt">${semGrupo}</span>` : ''}</button>
    </div>
    ${S.view === 'dre' ? `<span class="vsep"></span>
    <div class="seg">${[['previsto', 'Previsto', 'Pago + em aberto'], ['realizado', 'Realizado', 'Só o que já entrou/saiu'], ['aberto', 'Em aberto', 'O que falta receber/pagar']].map(([k, l, h]) => `<button title="${h}" class="${S.modo === k ? 'on' : ''}" onclick="modo('${k}')">${l}</button>`).join('')}</div>
    ${S.mes !== null ? `<button class="chipsel" onclick="selMes(${S.mes})">${MESES[S.mes]}/2026 ✕</button>` : ''}
    <span class="ml hint">${{ previsto: 'Tudo que foi pago + o que está em aberto', realizado: 'Só o que já entrou ou saiu do caixa', aberto: 'Quanto falta receber e pagar em cada mês' }[S.modo]}</span>`
    : `<span class="vsep"></span><input class="search" placeholder="Buscar tag..." value="${S.q}" oninput="S.q=this.value;render(true)"><span class="ml hint">Arraste uma tag para outro grupo, ou use o menu ⋯</span>`}
  </div>`;
}

function renderTags() {
  const semGrupo = TAGS.filter(t => !t.g).length;
  const total = TAGS.length, ok = total - semGrupo;
  const ano = t => SER[t.id].reduce((a, c) => a + c.real + c.open, 0);
  const cols = [{ k: null, n: 'Sem grupo', s: '?', d: 'Despesas aqui caem em "não classificadas"' }, ...GRUPOS];
  const q = S.q.trim().toLowerCase();
  const card = t => {
    const valor = ano(t);
    const menu = S.menu === t.id ? `<div class="menu" onclick="event.stopPropagation()"><div class="mh">Mover para</div>${cols.map(c => `<button class="${(t.g ?? null) === c.k ? 'cur' : ''}" onclick="move('${t.id}', ${c.k ? `'${c.k}'` : 'null'})"><span class="s">${c.s}</span>${c.n}${(t.g ?? null) === c.k ? ' ✓' : ''}</button>`).join('')}</div>` : '';
    return `<div class="tc ${S.flash === t.id ? 'flash' : ''}" draggable="true" ondragstart="dragS(event,'${t.id}')" ondragend="this.classList.remove('drag')" data-id="${t.id}">
      <span class="grip">⋮⋮</span><span class="dot" style="background:${t.cor}"></span>
      <span class="nm" title="${t.nome}">${t.nome}</span>${t.lock ? '<span class="lock" title="Tag automática do RH">RH</span>' : ''}${t.tipo === 'R' ? '<span class="lock" style="color:var(--green);border-color:currentColor" title="Usada em receitas">REC</span>' : ''}
      <span class="us"><b>${(valor / 1000).toLocaleString('pt-BR', { maximumFractionDigits: 0 })} mil</b>${t.n} mov.</span>
      <button class="mv" onclick="event.stopPropagation();S.menu=S.menu==='${t.id}'?null:'${t.id}';render(true)">⋯</button>${menu}
    </div>`;
  };
  return `
    ${toolbar(semGrupo)}
    <div class="intro">
      <p>Cada tag pertence a <b>um grupo da DRE</b>. A movimentação entra no grupo da <b>primeira tag classificada</b> dela — sem nenhuma, a receita fica em Receitas e a despesa em <b>Não classificadas</b>. As mudanças valem na hora para todos os anos.</p>
      <div class="prog"><div class="track"><b style="width:${ok / total * 100}%"></b></div><span>${ok} de ${total} tags classificadas</span></div>
    </div>
    <div class="board">${cols.map(c => {
      const ts = TAGS.filter(t => (t.g ?? null) === c.k && (!q || t.nome.toLowerCase().includes(q)));
      const soma = TAGS.filter(t => (t.g ?? null) === c.k).reduce((a, t) => a + ano(t), 0);
      const sgCls = c.s === '+' ? 'pos' : c.s === '−' ? 'neg' : '';
      return `<div class="col ${c.k === null ? 'none' : ''}" ondragover="dragO(event,this)" ondragleave="this.classList.remove('over')" ondrop="drop(event,this,${c.k ? `'${c.k}'` : 'null'})">
        <div class="ch"><span class="s ${sgCls}" style="${c.k === 'ignorar' || c.k === null ? 'color:var(--th-text)' : ''}">${c.s}</span><span class="n">${c.n}</span><span class="c">${TAGS.filter(t => (t.g ?? null) === c.k).length}</span></div>
        <div class="cd"><span>${c.d}</span>${soma ? `<b>${(soma / 1000).toLocaleString('pt-BR', { maximumFractionDigits: 0 })} mil/ano</b>` : ''}</div>
        <div class="cards">${ts.length ? ts.map(card).join('') : `<div class="empty">${q ? 'Nenhuma tag' : 'Solte uma tag aqui'}</div>`}</div>
      </div>`;
    }).join('')}</div>
    <div class="rules">
      <div><b>Várias tags na mesma movimentação</b>Vale a primeira tag que tiver grupo. Ex.: “Fornecedor + Frete” entra como Custo variável pela tag Fornecedor.</div>
      <div><b>Receita x despesa</b>O tipo da movimentação manda no sinal: uma receita nunca vira custo, mesmo que a tag esteja num grupo de despesa.</div>
      <div><b>Fora do fluxo</b>Some do relatório inteiro — use para transferências entre contas, aportes de sócio e estornos.</div>
    </div>`;
}

function render(keepScroll) {
  document.getElementById('app').innerHTML = S.view === 'dre' ? renderDRE() : renderTags();
  if (S.toast) document.getElementById('app').insertAdjacentHTML('beforeend', `<div class="toast">${S.toast} <button onclick="undo()">Desfazer</button></div>`);
  renderAnno();
}
let lastMove = null;
function move(id, g) {
  const t = TAGS.find(x => x.id === id); if (!t) return;
  lastMove = { id, g: t.g };
  t.g = g; S.menu = null; S.flash = id;
  S.toast = `“${t.nome}” → ${g ? GN[g].n : 'Sem grupo'}`;
  render(); clearTimeout(window._tt); window._tt = setTimeout(() => { S.toast = null; S.flash = null; render(); }, 3500);
}
function undo() { if (!lastMove) return; TAGS.find(x => x.id === lastMove.id).g = lastMove.g; S.toast = null; lastMove = null; render(); }
let dragId = null;
function dragS(e, id) { dragId = id; e.currentTarget.classList.add('drag'); e.dataTransfer.effectAllowed = 'move'; }
function dragO(e, el) { e.preventDefault(); el.classList.add('over'); }
function drop(e, el, g) { e.preventDefault(); el.classList.remove('over'); if (dragId) move(dragId, g); dragId = null; }
function tog(k) { S.exp.has(k) ? S.exp.delete(k) : S.exp.add(k); render(); }
function selMes(i) { S.mes = S.mes === i ? null : i; render(); }
function modo(m) { S.modo = m; render(); }
function go(v) { S.view = v; S.menu = null; render(); }
document.addEventListener('click', () => { if (S.menu) { S.menu = null; render(); } });

// Roteiro de estados para a aprovação
const STEPS = [
  ['1 · Previsto', () => Object.assign(S, { view: 'dre', modo: 'previsto', mes: null, exp: new Set() })],
  ['2 · Realizado', () => Object.assign(S, { view: 'dre', modo: 'realizado', mes: null, exp: new Set() })],
  ['3 · Em aberto', () => Object.assign(S, { view: 'dre', modo: 'aberto', mes: null, exp: new Set() })],
  ['4 · Grupo aberto', () => Object.assign(S, { view: 'dre', modo: 'previsto', mes: null, exp: new Set(['despesa_fixa', 'custo_variavel']) })],
  ['5 · Mês selecionado', () => Object.assign(S, { view: 'dre', modo: 'previsto', mes: HOJE_MES, exp: new Set() })],
  ['6 · Não classificadas', () => Object.assign(S, { view: 'dre', modo: 'previsto', mes: null, exp: new Set(['nao_classificado']) })],
  ['7 · Grupos das tags', () => Object.assign(S, { view: 'tags', menu: null })],
  ['8 · Menu mover', () => Object.assign(S, { view: 'tags', menu: 'manut' })],
];
let step = 0;
function renderAnno() {
  const dark = document.documentElement.classList.contains('dark');
  document.getElementById('anno').innerHTML = `<b>Fluxos</b>${STEPS.map((s, i) => `<button class="${i === step ? 'on' : ''}" onclick="event.stopPropagation();step=${i};STEPS[${i}][1]();render()">${s[0]}</button>`).join('')}<a href="mockup-fluxo-caixa-${dark ? 'light' : 'dark'}.html">${dark ? 'ver claro' : 'ver escuro'}</a>`;
}
render();
</script>
</body>
</html>
