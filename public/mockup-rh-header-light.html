<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Mockup — Header Recursos Humanos (Light)</title>
<style>
  :root {
    --bg: #FDFAF0;
    --header-bg: #FFE500;
    --header-border: #D4C000;
    --chip-bg: rgba(26,26,10,0.09);
    --chip-icon: #1A1A0E;
    --title: #1A1A0E;
    --muted: rgba(26,26,10,0.40);
    --accent: #D81E1E;
    --tab-bg: #FFE500;
    --tab-text: #1A1A0E;
    --card-bg: #FFFFFF;
    --card-border: rgba(26,26,10,0.08);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'DM Sans', -apple-system, sans-serif; background: var(--bg); color: var(--title); }
  .note { background: var(--accent); color: #fff; font-size: 12px; font-weight: 700; text-align: center; padding: 10px 16px; }
  .page { max-width: 1100px; margin: 0 auto; padding: 48px 24px 80px; }

  .header-wrap { position: relative; margin-bottom: 56px; }

  .header {
    background: var(--header-bg);
    border: 1px solid var(--header-border);
    border-radius: 20px 20px 20px 0;
    padding: 22px 26px 26px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    position: relative;
  }

  .header-left { display: flex; align-items: center; gap: 14px; }

  .icon-chip {
    width: 52px; height: 52px;
    border-radius: 14px;
    background: var(--chip-bg);
    color: var(--chip-icon);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .icon-chip svg { width: 24px; height: 24px; }

  .title-block h1 {
    font-size: 26px; font-weight: 900; letter-spacing: -0.01em; line-height: 1.1;
    margin: 0 0 4px; color: var(--title);
  }
  .title-block .eyebrow {
    font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.18em; color: var(--muted);
  }

  .cta {
    width: 30px; height: 30px;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(216,30,30,0.25);
    cursor: pointer;
    flex-shrink: 0;
  }
  .cta svg { width: 16px; height: 16px; }

  .month-nav { display: flex; align-items: center; gap: 10px; }
  .month-arrows { display: flex; gap: 4px; }
  .month-arrow {
    width: 26px; height: 26px;
    display: inline-flex; align-items: center; justify-content: center;
    background: rgba(26,26,10,0.08);
    color: #1A1A0E;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  .month-arrow svg { width: 14px; height: 14px; }

  .calendar-card {
    background: var(--card-bg);
    border: 1px solid rgba(26,26,10,0.07);
    border-radius: 18px;
    overflow: hidden;
  }
  .calendar-topbar {
    background: #FFE500;
    border-bottom: 1px solid #D4C000;
    padding: 10px 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .calendar-topbar .month-label { font-size: 13px; font-weight: 900; color: #1A1A0E; text-transform: capitalize; }
  .calendar-body { padding: 20px; font-size: 13px; color: var(--muted); }

  .dados-strip { position: absolute; left: -1px; bottom: -34px; display: flex; align-items: stretch; height: 34px; }

  .dados-tab {
    width: 136px; height: 34px;
    display: flex; align-items: center; justify-content: center;
    background: var(--tab-bg); color: var(--tab-text);
    border: 1px solid var(--header-border); border-top: none;
    font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em;
    box-shadow: inset 0 6px 8px -5px rgba(26,26,10,0.35);
    cursor: pointer;
    padding: 0 10px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .dados-tab:last-child { border-radius: 0 0 12px 0; }
  .dados-tab.active { opacity: 1; font-weight: 900; }
  .dados-tab.inactive { opacity: 0.55; }

  .content-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    padding: 20px 24px;
    font-size: 13px;
    color: var(--muted);
  }
</style>
</head>
<body>
  <div class="note">MOCKUP — Recursos Humanos com o mesmo padrão de header/abas do Controle Financeiro (4 abas: Calendário, Finanças, Colaboradores 🔒, Caderninho 🔒)</div>
  <div class="page">
    <div class="header-wrap">
      <div class="header">
        <div class="header-left">
          <div class="icon-chip">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          </div>
          <div class="title-block">
            <h1>Recursos Humanos</h1>
            <div class="eyebrow">Planejamento Interno</div>
          </div>
        </div>
      </div>

      <div class="dados-strip">
        <div class="dados-tab active">Calendário</div>
        <div class="dados-tab inactive">Finanças</div>
        <div class="dados-tab inactive">Colaborador…</div>
        <div class="dados-tab inactive">Caderninho</div>
      </div>
    </div>

    <div class="calendar-card">
      <div class="calendar-topbar">
        <div class="month-nav">
          <span class="month-label">Agosto 2026</span>
          <div class="month-arrows">
            <button class="month-arrow" title="Mês anterior">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <button class="month-arrow" title="Próximo mês">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
            </button>
          </div>
        </div>
        <button class="cta" title="Novo Evento">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5v14"/></svg>
        </button>
      </div>
      <div class="calendar-body">
        Grade do calendário (dias do mês) segue aqui normalmente.
      </div>
    </div>
  </div>
</body>
</html>
