<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>User Menu — Light</title>
<style>
  :root {
    --primary: #D81E1E;
    --surface: #ffffff;
    --on-surface: #1A1208;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'DM Sans', -apple-system, sans-serif;
    background: #EFEADA;
    min-height: 100vh;
    padding: 40px;
    display: flex;
    gap: 32px;
    align-items: flex-start;
    flex-wrap: wrap;
  }

  .frame-label {
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: rgba(26,26,10,0.4);
    margin-bottom: 10px;
  }

  .frame {
    position: relative;
    background: #FDFAF0;
    border-radius: 20px;
    box-shadow: 0 8px 30px rgba(26,26,10,0.12);
    overflow: hidden;
  }
  .frame.desktop { width: 620px; height: 420px; }
  .frame.mobile { width: 300px; height: 560px; border-radius: 32px; border: 6px solid #1A1A0E; }

  .fake-page {
    padding: 24px;
    color: rgba(26,26,10,0.25);
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  /* ── User menu button — top right ── */
  .user-menu-wrap {
    position: absolute;
    top: 14px;
    right: 14px;
    z-index: 50;
  }
  .avatar-btn {
    width: 42px;
    height: 42px;
    border-radius: 999px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(26,26,10,0.08);
    box-shadow: 0 2px 16px rgba(0,0,0,0.12);
    cursor: pointer;
    font-weight: 800;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--primary);
    background-image: linear-gradient(180deg, rgba(216,30,30,0.08), rgba(216,30,30,0.03));
    transition: box-shadow 0.15s ease, transform 0.1s ease;
  }
  .avatar-btn:hover {
    box-shadow: 0 2px 20px rgba(0,0,0,0.18), 0 0 0 3px rgba(216,30,30,0.10);
  }
  .avatar-btn:active { transform: scale(0.94); }

  .dropdown {
    position: absolute;
    top: calc(100% + 10px);
    right: 0;
    width: 224px;
    background: var(--surface);
    border: 1px solid rgba(26,26,10,0.08);
    border-radius: 18px;
    box-shadow: 0 12px 40px rgba(26,26,10,0.16), 0 2px 8px rgba(26,26,10,0.06);
    overflow: hidden;
    transform-origin: top right;
  }

  .dropdown-header {
    padding: 13px 15px 11px;
    display: flex;
    align-items: center;
    gap: 9px;
    border-bottom: 1px solid rgba(26,26,10,0.06);
  }
  .dropdown-avatar {
    width: 32px; height: 32px;
    border-radius: 999px;
    background-image: linear-gradient(180deg, rgba(216,30,30,0.10), rgba(216,30,30,0.04));
    color: var(--primary);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 11.5px;
    flex-shrink: 0;
  }
  .dropdown-name {
    font-size: 12.5px;
    font-weight: 800;
    color: var(--on-surface);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .dropdown-role {
    font-size: 9.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: rgba(26,26,10,0.35);
    margin-top: 1px;
  }

  .dropdown-item {
    display: flex;
    align-items: center;
    gap: 9px;
    width: 100%;
    padding: 10px 15px;
    background: none;
    border: none;
    text-align: left;
    font-size: 12px;
    font-weight: 700;
    color: var(--on-surface);
    cursor: pointer;
    transition: background 0.12s ease;
  }
  .dropdown-item:hover { background: rgba(26,26,10,0.045); }
  .dropdown-item svg { flex-shrink: 0; opacity: 0.55; }

  .dropdown-item.danger { color: var(--primary); }
  .dropdown-item.danger svg { opacity: 0.85; }
  .dropdown-item.danger:hover { background: rgba(216,30,30,0.06); }

  .dropdown-sep { height: 1px; background: rgba(26,26,10,0.06); margin: 4px 0; }

  /* ── Mobile variant: mais fino ── */
  .mobile .avatar-btn {
    width: 32px;
    height: 32px;
    font-size: 11px;
  }
  .mobile .dropdown {
    width: 152px;
    border-radius: 13px;
    top: calc(100% + 8px);
  }
  .mobile .dropdown-header {
    padding: 9px 10px 8px;
    gap: 7px;
  }
  .mobile .dropdown-avatar {
    width: 25px;
    height: 25px;
    font-size: 9.5px;
  }
  .mobile .dropdown-name {
    font-size: 11px;
  }
  .mobile .dropdown-role {
    font-size: 8.3px;
  }
  .mobile .dropdown-item {
    padding: 8px 10px;
    font-size: 10.5px;
    gap: 7px;
  }
  .mobile .dropdown-item svg {
    width: 12px;
    height: 12px;
  }

  .caption {
    margin-top: 12px;
    font-size: 11px;
    font-weight: 600;
    color: rgba(26,26,10,0.4);
    max-width: 300px;
    line-height: 1.5;
  }
</style>
</head>
<body>
  <div>
    <div class="frame-label">Desktop</div>
    <div class="frame desktop">
      <div class="fake-page">App Consulta de Produtos</div>
      <div class="user-menu-wrap">
        <div class="avatar-btn">DM</div>
        <div class="dropdown">
          <div class="dropdown-header">
            <div class="dropdown-avatar">DM</div>
            <div>
              <div class="dropdown-name">Dimit Maizias</div>
              <div class="dropdown-role">Admin</div>
            </div>
          </div>
          <button class="dropdown-item">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
            Mudar para modo Mobile
          </button>
          <div class="dropdown-sep"></div>
          <button class="dropdown-item danger">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Sair da conta
          </button>
        </div>
      </div>
    </div>
    <div class="caption">Botão e dropdown em tamanho normal (42px).</div>
  </div>

  <div>
    <div class="frame-label">Mobile</div>
    <div class="frame mobile">
      <div class="fake-page">App Consulta</div>
      <div class="user-menu-wrap">
        <div class="avatar-btn">DM</div>
        <div class="dropdown">
          <div class="dropdown-header">
            <div class="dropdown-avatar">DM</div>
            <div>
              <div class="dropdown-name">Dimit Maizias</div>
              <div class="dropdown-role">Admin</div>
            </div>
          </div>
          <button class="dropdown-item">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="2" width="12" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
            Modo Desktop
          </button>
          <div class="dropdown-sep"></div>
          <button class="dropdown-item danger">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Sair da conta
          </button>
        </div>
      </div>
    </div>
    <div class="caption">Botão (32px) e dropdown (152px) reduzidos — mais fino para caber na tela pequena.</div>
  </div>
</body>
</html>
