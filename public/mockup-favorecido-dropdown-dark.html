<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Favorecido Dropdown — Dark Mode</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;0,9..40,900&family=DM+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'DM Sans',sans-serif; background:#0F0F0B; display:flex; justify-content:center; align-items:flex-start; min-height:100vh; padding:60px 16px;}
  .modal{width:480px; background:#1E1E18; border-radius:24px; padding:24px; box-shadow:0 40px 90px rgba(0,0,0,0.55);}
  .modal-title{font-size:18px; font-weight:800; color:#F2F0E3; margin-bottom:20px;}
  .field-label{font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:0.08em; color:rgba(242,240,227,0.40); margin-bottom:6px; display:block;}
  .field-wrap{position:relative;}
  .field-input{width:100%; background:#252520; border:1.5px solid #D81E1E; border-radius:12px; padding:10px 13px; font-size:14px; color:#F2F0E3; outline:none;}

  .dropdown{background:#2a2a24; border:1px solid rgba(242,240,227,0.10); border-radius:12px; box-shadow:0 20px 40px rgba(0,0,0,0.45); overflow:hidden; margin-top:6px;}
  .item{padding:10px 13px; cursor:pointer; transition:background 0.12s;}
  .item:hover{background:rgba(242,240,227,0.06);}
  .item .name{font-size:13px; font-weight:600; color:#F2F0E3;}
  .item .sub{font-size:11px; color:rgba(242,240,227,0.40); margin-left:8px;}

  .badge{display:inline-block; font-size:9px; font-weight:800; text-transform:uppercase; letter-spacing:0.06em; padding:3px 8px; border-radius:6px; margin-bottom:8px; background:rgba(5,150,105,0.15); color:#34D399;}
  .col-label{font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:0.08em; color:rgba(242,240,227,0.45); margin-bottom:10px; text-align:center;}
</style>
</head>
<body>

<div>
  <div class="col-label">Dark — inalterado (já usava esse tom), agora via token dark: explícito</div>
  <div class="modal">
    <div class="modal-title">Nova Movimentação</div>
    <span class="badge">Sem regressão</span>
    <span class="field-label" style="display:block;">Favorecido</span>
    <div class="field-wrap">
      <div class="field-input">Digite para buscar...</div>
      <div class="dropdown">
        <div class="item"><span class="name">ALTERNATIVA PLANTAS E JARDINAGENS LTDA</span><span class="sub">GENERAL CIA SECURITIZADORA</span></div>
        <div class="item"><span class="name">ANDRE SACOS</span><span class="sub">ANDRE SACOS</span></div>
        <div class="item"><span class="name">ARCOM</span><span class="sub">ARCOM</span></div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
