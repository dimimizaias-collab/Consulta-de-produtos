<!doctype html>
<html lang="pt-BR" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controle Financeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFFCEC; --text: #1A1A0E; --muted: rgba(26,26,10,0.45); --faint: rgba(26,26,10,0.28);
    --hdr: #FBF35E; --hdr-border: #D9CF45; --hdr-text: #1A1A0E; --chip: rgba(26,26,10,0.09); --hover: rgba(26,26,10,0.07);
    --card: #FFFFFF; --card-border: #E0D8BF; --field-hover: #CFC4A2; --btn: rgba(26,26,10,0.06); --btn-hover: rgba(26,26,10,0.11);
    --line: #EFE8D2; --soft: #FAF7EE;
    --menu: #FFFFFF; --menu-border: #E0D8BF; --menu-hover: #FFF8D0;
    --grid: #A8A290; --row-odd: #FAF7EE; --row-hover: #FFF8D0; --th: #FFEC4D; --th-line: #B8A31F; --th-bottom: #8F7E10; --th-text: rgba(26,26,10,0.55);
    --tabshadow: inset 0 6px 8px -5px rgba(26,26,10,0.35);
    --emerald: #0A7A55; --amber: #B45309;
    --rail: 64px; --hh: 44px;
  }
  html.dark {
    --bg: #161612; --text: #F2F0E3; --muted: rgba(242,240,227,0.42); --faint: rgba(242,240,227,0.25);
    --hdr: #252520; --hdr-border: rgba(242,240,227,0.08); --hdr-text: #F2F0E3; --chip: rgba(216,30,30,0.13); --hover: rgba(242,240,227,0.06);
    --card: #1E1E18; --card-border: rgba(242,240,227,0.10); --field-hover: rgba(242,240,227,0.20); --btn: rgba(242,240,227,0.06); --btn-hover: rgba(242,240,227,0.11);
    --line: rgba(242,240,227,0.06); --soft: #1A1A15;
    --menu: #2E2E28; --menu-border: rgba(242,240,227,0.10); --menu-hover: rgba(255,229,0,0.08);
    --grid: rgba(242,240,227,0.20); --row-odd: #1E1E18; --row-hover: rgba(242,240,227,0.04); --th-text: rgba(26,26,10,0.58);
    --tabshadow: inset 0 6px 8px -5px rgba(0,0,0,0.55);
    --emerald: #34D399; --amber: #FBBF24;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; }
  button { font-family: inherit; }

  .anno { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 100; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; padding: 8px 10px; border-radius: 14px; background: #1A1A0E; color: #F2F0E3; font-size: 12px; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,.35); max-width: calc(100vw - 24px); }
  .anno b { color: #FFE500; }
  .anno button { border: 1px solid rgba(242,240,227,.18); background: transparent; color: #F2F0E3; padding: 5px 11px; border-radius: 999px; cursor: pointer; font-weight: 700; font-size: 11.5px; }

  /* Shell (já implementado) */
  .hdr { position: fixed; top: 0; left: 0; right: 0; z-index: 50; height: var(--hh); display: flex; align-items: stretch; background: var(--hdr); border-bottom: 1px solid var(--hdr-border); }
  .logo { width: var(--rail); display: grid; place-items: center; border-right: 1px solid var(--hdr-border); }
  .logo span { width: 32px; height: 32px; display: grid; place-items: center; background: #fff; color: #D81E1E; font-size: 8.5px; font-weight: 900; border: 1px solid rgba(26,26,10,0.12); }
  .ttl { display: flex; align-items: center; gap: 9px; padding: 0 16px; }
  .ico { width: 28px; height: 28px; display: grid; place-items: center; background: var(--chip); color: var(--hdr-text); }
  html.dark .ico { color: #D81E1E; }
  .ttl h1 { margin: 0; font-size: 15px; font-weight: 900; color: var(--hdr-text); }
  .pbtn { margin: auto 10px auto auto; width: 30px; height: 30px; display: grid; place-items: center; border: 1px solid rgba(26,26,10,0.16); background: rgba(26,26,10,0.06); color: var(--hdr-text); font-size: 11.5px; font-weight: 900; }
  html.dark .pbtn { border-color: rgba(242,240,227,0.14); background: rgba(216,30,30,0.13); }
  .rail { position: fixed; left: 0; top: var(--hh); bottom: 0; width: var(--rail); z-index: 45; background: var(--hdr); border-right: 1px solid var(--hdr-border); display: flex; flex-direction: column; align-items: center; padding: 8px 0; gap: 4px; }
  .nav { width: 48px; height: 44px; display: grid; place-items: center; color: var(--hdr-text); opacity: .6; }
  .nav.on { opacity: 1; background: #D81E1E; color: #fff; }
  .rail .sp { flex: 1; }
  main { margin-left: var(--rail); padding-top: var(--hh); }

  /* ── NOVO: abas penduradas na barra + ferramentas na mesma linha ── */
  .tabrow { position: sticky; top: var(--hh); z-index: 20; display: flex; align-items: flex-start; gap: 12px; background: var(--bg); padding-right: 16px; }
  .tabs { display: flex; flex-shrink: 0; }
  .tab { height: 32px; min-width: 112px; padding: 0 14px; display: flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--hdr-border); border-top: 0; margin-left: -1px; background: var(--hdr); color: var(--hdr-text); box-shadow: var(--tabshadow); font-size: 11px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; white-space: nowrap; cursor: pointer; }
  .tab:first-child { margin-left: 0; border-left: 0; }
  .tab .l { opacity: .55; transition: opacity 130ms; }
  .tab:hover .l { opacity: .85; }
  .tab.on { box-shadow: var(--tabshadow), inset 0 -3px 0 #D81E1E; }
  .tab.on .l { opacity: 1; }
  .tab .n { font-size: 9px; font-weight: 900; padding: 1px 6px; border-radius: 999px; background: rgba(26,26,10,0.12); }
  html.dark .tab .n { background: rgba(242,240,227,0.10); }
  .tools { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .cnt { height: 28px; display: flex; align-items: center; gap: 6px; padding: 0 9px; border: 1px solid var(--card-border); font-size: 11px; font-weight: 700; color: var(--muted); white-space: nowrap; }
  .cnt b { color: var(--text); font-weight: 900; }
  .search { width: 260px; height: 28px; display: flex; align-items: center; gap: 7px; padding: 0 9px; border: 1px solid var(--card-border); background: var(--card); color: var(--faint); font-size: 12px; font-weight: 600; transition: border-color 130ms; }
  .search:hover { border-color: var(--field-hover); }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--text); font: 600 12px 'DM Sans'; caret-color: #D81E1E; }
  .search input::placeholder { color: var(--faint); font-weight: 500; }
  .tb { height: 28px; display: flex; align-items: center; gap: 6px; padding: 0 10px; border: 1px solid var(--card-border); background: var(--card); color: var(--text); font-size: 10.5px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; white-space: nowrap; cursor: pointer; transition: background 130ms, transform 130ms; }
  .tb:hover { background: var(--btn); }
  .tb:active { transform: scale(0.97); }
  .tb.on { background: #D81E1E; border-color: #D81E1E; color: #fff; }
  .tb.pri { background: #D81E1E; border-color: #D81E1E; color: #fff; }
  .tb.pri:hover { background: #B91818; }
  .tb.ic { width: 28px; padding: 0; justify-content: center; }
  .grow { flex: 1; }

  .content { padding: 12px 16px 90px; display: flex; flex-direction: column; gap: 12px; }

  /* ── Painéis quadrados: Calendário + Resultados + Fornecedores ── */
  .panels { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; align-items: stretch; }
  .pn { border: 1px solid var(--card-border); background: var(--card); display: flex; flex-direction: column; }
  .ph { height: 32px; display: flex; align-items: center; gap: 6px; padding: 0 6px 0 10px; background: var(--th); border-bottom: 1.5px solid var(--th-bottom); color: #1A1A0E; }
  .ph .t { font-size: 9px; font-weight: 900; letter-spacing: 0.1em; text-transform: uppercase; color: var(--th-text); }
  .ph .m { font-size: 12.5px; font-weight: 900; text-transform: capitalize; }
  .ph .sp { flex: 1; }
  .pb { width: 22px; height: 22px; display: grid; place-items: center; border: 0; background: rgba(26,26,10,0.08); color: rgba(26,26,10,0.6); cursor: pointer; }
  .pb:hover { background: rgba(26,26,10,0.15); }
  .pb.on { background: #D81E1E; color: #fff; }
  .cal { padding: 8px; }
  .wk, .days { display: grid; grid-template-columns: repeat(7, 1fr); }
  .wk div { text-align: center; font-size: 8.5px; font-weight: 900; color: var(--faint); padding: 3px 0; }
  .days button { position: relative; height: 24px; border: 0; background: transparent; color: var(--muted); font-size: 10.5px; font-weight: 700; cursor: pointer; }
  .days button:hover { background: var(--btn); }
  .days button.out { color: var(--faint); opacity: .5; cursor: default; }
  .days button.today { background: rgba(216,30,30,0.10); color: #D81E1E; font-weight: 900; }
  .days button.sel { background: #D81E1E; color: #fff; font-weight: 900; }
  .days button i { position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; border-radius: 9px; background: #D81E1E; }
  .days button.sel i { background: #fff; }
  .period { margin-top: 6px; height: 24px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; border: 1px solid var(--card-border); background: var(--soft); font-size: 9.5px; font-weight: 800; color: var(--muted); }
  .period.f { border-color: rgba(216,30,30,0.25); background: rgba(216,30,30,0.06); color: #D81E1E; }
  .sw { width: 50%; min-width: 210px; display: flex; gap: 2px; padding: 2px; background: rgba(26,26,10,0.10); }
  .sw button { flex: 1; height: 22px; border: 0; background: transparent; color: rgba(26,26,10,0.5); font-size: 9px; font-weight: 900; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; transition: background 130ms, color 130ms; }
  .sw button:hover { color: rgba(26,26,10,0.75); }
  .sw button.on { background: #D81E1E; color: #fff; }
  .fornOnly { display: none; gap: 4px; }
  .fornOnly.show { display: flex; }
  .ph .sw + .sp { min-width: 8px; }
  .fsub { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px 0; font-size: 8.5px; font-weight: 900; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .fcount { letter-spacing: 0.04em; text-transform: none; font-size: 10.5px; font-weight: 700; }
  .fcount b { color: var(--text); font-weight: 900; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; flex: 1; }
  .stat { display: flex; flex-direction: column; justify-content: center; gap: 6px; padding: 10px 12px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .stat:nth-child(2n) { border-right: 0; }
  .stat:nth-child(n+3) { border-bottom: 0; }
  .stat .k { align-self: flex-start; height: 24px; display: inline-flex; align-items: center; gap: 6px; padding: 0 8px 0 3px; border: 1px solid var(--card-border); background: var(--soft); font-size: 8.5px; font-weight: 900; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  .stat .k span { width: 18px; height: 18px; display: grid; place-items: center; flex-shrink: 0; }
  .stat .v { height: 38px; display: flex; align-items: center; padding: 0 10px; border: 1px solid var(--card-border); background: var(--card); font-size: 19px; font-weight: 900; letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat .k { align-self: stretch; }
  .chart { flex: 1; display: flex; align-items: flex-end; gap: 6px; padding: 8px 12px 8px; margin: 0 0 4px; min-height: 140px; }
  .bar { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 3px; height: 100%; min-width: 0; }
  .bar b { font-size: 8.5px; font-weight: 900; color: #7C3AED; white-space: nowrap; }
  html.dark .bar b { color: #A78BFA; }
  .bar i { width: 100%; max-width: 22px; background: #8B5CF6; }
  .bar small { font-size: 7.5px; font-weight: 800; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ── Tabela de notas em grade ── */
  .tblw { border: 1px solid var(--card-border); background: var(--card); overflow: auto; }
  table { border-collapse: collapse; width: 100%; min-width: 1100px; }
  th { background: var(--th); color: var(--th-text); box-shadow: inset -1px 0 0 var(--th-line), inset 0 -1.5px 0 var(--th-bottom); height: 32px; padding: 0 10px; font-size: 9px; font-weight: 900; letter-spacing: 0.1em; text-transform: uppercase; text-align: left; white-space: nowrap; }
  th:last-child { box-shadow: inset 0 -1.5px 0 var(--th-bottom); }
  td { height: 36px; padding: 0 10px; border-bottom: 1px solid var(--grid); border-right: 1px solid var(--grid); font-size: 12px; font-weight: 600; white-space: nowrap; }
  td:last-child { border-right: 0; }
  tbody tr:nth-child(even) td { background: var(--row-odd); }
  tbody tr:hover td { background: var(--row-hover); }
  .mono { font-family: 'DM Mono'; font-size: 11.5px; color: var(--muted); font-weight: 500; }
  .r { text-align: right; } .c { text-align: center; }
  .stt { display: inline-flex; align-items: center; gap: 4px; font-size: 9px; font-weight: 900; text-transform: uppercase; letter-spacing: .08em; padding: 3px 8px; border-radius: 999px; border: 1px solid; }
  .s-rev { color: #1D4ED8; background: rgba(37,99,235,.08); border-color: rgba(37,99,235,.25); } html.dark .s-rev { color: #60A5FA; }
  .s-reg { color: #57534E; background: rgba(26,26,10,.06); border-color: rgba(26,26,10,.15); } html.dark .s-reg { color: #D8D3C0; background: rgba(242,240,227,.08); border-color: rgba(242,240,227,.2); }
  .s-agu { color: #B45309; background: rgba(217,119,6,.10); border-color: rgba(217,119,6,.3); } html.dark .s-agu { color: #FCD34D; }
  .s-apr { color: #0A7A55; background: rgba(16,185,129,.10); border-color: rgba(16,185,129,.25); } html.dark .s-apr { color: #34D399; }
  .ver { font-size: 10.5px; font-weight: 900; }
  .ver.ok { color: var(--emerald); } .ver.pend { color: var(--amber); }
  .fin { display: flex; align-items: center; gap: 6px; }
  .fin span { max-width: 130px; overflow: hidden; text-overflow: ellipsis; font-weight: 800; color: var(--emerald); }
  .fin span.no { color: var(--faint); font-weight: 600; }
  .ab { width: 26px; height: 26px; display: grid; place-items: center; border: 1px solid var(--card-border); background: var(--card); color: var(--muted); cursor: pointer; flex-shrink: 0; transition: background 130ms, color 130ms; }
  .ab:hover { background: var(--btn); color: var(--text); }
  .ab.link.on { border-color: rgba(16,185,129,.35); background: rgba(16,185,129,.09); color: var(--emerald); }
  .ab.ed { color: #D81E1E; } .ab.ed:hover { background: #D81E1E; color: #fff; border-color: #D81E1E; }
  .ab.ap { color: var(--emerald); } .ab.ap:hover { background: #0A7A55; color: #fff; border-color: #0A7A55; }
  .acts { display: flex; gap: 4px; }
  .plist { padding: 8px; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; }
  .pr { display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 8px; border: 1px solid var(--card-border); background: var(--card); }
  .pr .pi { width: 26px; height: 26px; display: grid; place-items: center; flex-shrink: 0; }
  .pr .pt { flex: 1; min-width: 0; }
  .pr .pt b { display: block; font-size: 11.5px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pr .pt small { display: block; font-size: 9.5px; font-weight: 600; color: var(--muted); margin-top: 1px; }
  .pr .pv { height: 28px; display: flex; align-items: center; padding: 0 9px; border: 1px solid var(--card-border); background: var(--soft); font-size: 12.5px; font-weight: 900; letter-spacing: -0.01em; white-space: nowrap; }
  .neg { color: #DC2626; } html.dark .neg { color: #F87171; }
  .pos { color: #059669; } html.dark .pos { color: #34D399; }
  .tagc { display: inline-flex; height: 18px; align-items: center; padding: 0 6px; margin-right: 3px; font-size: 9px; font-weight: 900; letter-spacing: .05em; text-transform: uppercase; border: 1px solid; }
  .t1 { color: #7C3AED; border-color: rgba(124,58,237,.3); background: rgba(124,58,237,.07); }
  .t2 { color: #0369A1; border-color: rgba(3,105,161,.3); background: rgba(3,105,161,.07); }
  .t3 { color: #B45309; border-color: rgba(180,83,9,.3); background: rgba(180,83,9,.07); }
  .ck { width: 16px; height: 16px; border: 1.5px solid var(--card-border); display: inline-grid; place-items: center; vertical-align: middle; }
  .ck.on { background: #0A7A55; border-color: #0A7A55; color: #fff; }
  .typ { font-size: 9px; font-weight: 900; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; }
  .typ.d { background: rgba(239,68,68,.1); color: #DC2626; } .typ.r { background: rgba(16,185,129,.1); color: #059669; }
  .ph-place { padding: 60px 20px; text-align: center; color: var(--muted); font-weight: 600; font-size: 13px; border: 1px dashed var(--card-border); }
</style>
</head>
<body>

<header class="hdr">
  <div class="logo"><span>R$1,99</span></div>
  <div class="ttl"><div class="ico"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg></div><h1>Controle Financeiro</h1></div>
  <div class="pbtn">DM</div>
</header>
<aside class="rail">
  <div class="nav"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"><path d="M21 8 12 3 3 8v8l9 5 9-5Z"/></svg></div>
  <div class="nav"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"><path d="M12 20V10M18 20V4M6 20v-4"/></svg></div>
  <div class="nav"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg></div>
  <div class="nav on"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg></div>
  <div class="nav"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></div>
  <div class="sp"></div>
  <div class="nav"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/></svg></div>
  <div class="nav"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"><circle cx="12" cy="12" r="3"/><path d="M12 1v3M12 20v3M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M1 12h3M20 12h3"/></svg></div>
</aside>

<main>
  <div class="tabrow">
    <div class="tabs" id="tabs"></div>
  </div>

  <div class="content" id="c-notas">
    <div class="panels">
      <!-- Calendário -->
      <div class="pn">
        <div class="ph"><span class="m">Outubro 2026</span><span class="sp"></span>
          <button class="pb" title="Legenda"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg></button>
          <button class="pb" id="rng" title="Filtrar por período"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M22 3H2l8 9.46V19l4 2v-8.54z"/></svg></button>
          <button class="pb"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg></button>
          <button class="pb"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg></button>
        </div>
        <div class="cal">
          <div class="wk"><div>D</div><div>S</div><div>T</div><div>Q</div><div>Q</div><div>S</div><div>S</div></div>
          <div class="days" id="days"></div>
          <div class="period" id="period">Mostrando: outubro 2026 (mês atual)</div>
        </div>
      </div>
      <!-- ADM / Cartões / Contas (interruptor) -->
      <div class="pn">
        <div class="ph">
          <div class="sw" id="sw" style="width:60%;min-width:260px"><button class="on" data-v="adm">ADM</button><button data-v="car">Cartões</button><button data-v="con">Contas</button></div>
        </div>
        <div class="plist" id="plist"></div>
      </div>
    </div>

    <div class="tools" id="tools">
      <label class="search"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input placeholder="Buscar favorecido…"></label>
      <button class="tb" id="fbtn"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M22 3H2l8 9.46V19l4 2v-8.54z"/></svg>Filtrar colunas</button>
      <button class="tb pri ic" title="Nova movimentação"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="tb ic" id="selbtn" title="Selecionar"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="m9 12 2 2 4-4"/></svg></button>
      <button class="tb ic" title="Guia de tags"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg></button>
      <span class="grow"></span>
      <button class="tb ic" id="cardbtn" title="Ver tabela de Cartões de Crédito"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg></button>
    </div>

    <div class="tblw"><table>
      <thead><tr><th>Código</th><th>Data</th><th>Tipo</th><th>Pagamento</th><th>Favorecido</th><th>Estabelec.</th><th>Tags</th><th>Vencimento</th><th class="r">Valor final</th><th class="r">Total pago</th><th class="r">Restante</th><th class="c">Pago</th><th style="width:62px"></th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
  </div>

  <div class="content" id="c-outra" style="display:none"><div class="ph-place">Conteúdo da aba <b id="otherName"></b> — fica como está nesta etapa (só a aba muda).</div></div>
</main>

<div class="anno">
  <span><b>Mockup</b> — Controle Financeiro</span>
  <button id="theme">Claro/escuro</button>
</div>

<script>
const TABS = [['Controle Financeiro'], ['Favorecidos'], ['Contas']];
let tab = 0;
function renderTabs() {
  document.getElementById('tabs').innerHTML = TABS.map((t, i) => `<button class="tab ${i === tab ? 'on' : ''}" data-i="${i}"><span class="l">${t[0]}</span>${t[1] ? `<span class="n">${t[1]}</span>` : ''}</button>`).join('');
  document.getElementById('c-notas').style.display = tab === 0 ? '' : 'none';
  document.getElementById('c-outra').style.display = tab === 0 ? 'none' : '';
  document.getElementById('otherName').textContent = TABS[tab][0];
}
document.getElementById('tabs').addEventListener('click', e => { const b = e.target.closest('.tab'); if (b) { tab = +b.dataset.i; renderTabs(); } });
renderTabs();

// Calendário
let sel = null;
const notesDays = new Set([1, 2, 3, 6, 8, 9, 13, 14, 15, 20, 22, 23, 27, 29]);
function renderCal() {
  const first = 4, total = 31; let h = '';
  for (let i = 0; i < first; i++) h += `<button class="out">${27 + i}</button>`;
  for (let d = 1; d <= total; d++) h += `<button data-d="${d}" class="${d === 1 ? 'today' : ''} ${d === sel ? 'sel' : ''}">${d}${notesDays.has(d) ? '<i></i>' : ''}</button>`;
  const rest = (7 - (first + total) % 7) % 7; for (let i = 1; i <= rest; i++) h += `<button class="out">${i}</button>`;
  document.getElementById('days').innerHTML = h;
  const p = document.getElementById('period');
  p.className = 'period' + (sel ? ' f' : '');
  p.innerHTML = sel ? `Data: ${String(sel).padStart(2, '0')}/10/2026 <span style="cursor:pointer" id="clr">✕</span>` : 'Mostrando: outubro 2026 (mês atual)';
  const c = document.getElementById('clr'); if (c) c.onclick = () => { sel = null; renderCal(); };
}
document.getElementById('days').addEventListener('click', e => { const b = e.target.closest('[data-d]'); if (b) { sel = sel === +b.dataset.d ? null : +b.dataset.d; renderCal(); } });
document.getElementById('rng').addEventListener('click', e => e.currentTarget.classList.toggle('on'));
renderCal();

// Painel ADM / Cartões / Contas
const PANEL = {
  adm: [['#D97706', 'rgba(217,119,6,.1)', '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>', 'Vencimento no período', '12 movimentações', 'R$ 18.420,00', 'neg'],
        ['#059669', 'rgba(16,185,129,.1)', '<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>', 'Total pago', '31 movimentações quitadas', 'R$ 42.118,90', 'pos'],
        ['#DC2626', 'rgba(239,68,68,.1)', '<path d="m22 17-8.5-8.5-5 5L2 7"/><path d="M16 17h6v-6"/>', 'Saídas sem vencimento', 'Pagamentos à vista', 'R$ 6.732,40', 'neg']],
  car: [['#D81E1E', 'rgba(216,30,30,.08)', '<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>', 'Nubank Empresas', 'Vence 10/10 · Fecha 03/10', 'R$ 3.912,77', 'neg'],
        ['#D81E1E', 'rgba(216,30,30,.08)', '<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>', 'Itaú Business', 'Vence 15/10 · Fecha 08/10', 'R$ 1.204,30', 'pos']],
  con: [['#D81E1E', 'rgba(216,30,30,.08)', '<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>', 'Conta Movimento', 'Banco do Brasil', 'R$ 24.880,12', 'pos'],
        ['#D81E1E', 'rgba(216,30,30,.08)', '<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>', 'Caixa Loja', 'Dinheiro', 'R$ 1.310,00', 'pos'],
        ['#D81E1E', 'rgba(216,30,30,.08)', '<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>', 'Conta PJ', 'Sicoob', '-R$ 412,55', 'neg']],
};
function renderPanel(k) {
  document.getElementById('plist').innerHTML = PANEL[k].map(r => `<div class="pr"><span class="pi" style="color:${r[0]};background:${r[1]}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">${r[2]}</svg></span><div class="pt"><b>${r[3]}</b><small>${r[4]}</small></div><span class="pv ${r[6]}">${r[5]}</span></div>`).join('');
}
document.getElementById('sw').addEventListener('click', e => {
  const b = e.target.closest('[data-v]'); if (!b) return;
  document.querySelectorAll('#sw button').forEach(x => x.classList.toggle('on', x === b));
  renderPanel(b.dataset.v);
});
renderPanel('adm');
document.getElementById('fbtn').addEventListener('click', e => e.currentTarget.classList.toggle('on'));
document.getElementById('selbtn').addEventListener('click', e => e.currentTarget.classList.toggle('on'));
document.getElementById('cardbtn').addEventListener('click', e => e.currentTarget.classList.toggle('on'));

const favs = ['DISPEL MAXX', 'CHOCOMAR 01', 'ENEL ENERGIA', 'ARCOM', 'ALUGUEL LOJA 2', 'SABESP', 'DISTRIBUIDORA ALVORADA', 'FOLHA DE PAGAMENTO'];
const pags = ['Boleto', 'PIX', 'Crédito', 'Débito', 'Transferência'];
const tagSet = [['t1', 'Mercadoria'], ['t2', 'Fixa'], ['t3', 'Imposto']];
const ed = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>';
const dl = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>';
const brl = v => 'R$ ' + v.toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
document.getElementById('rows').innerHTML = Array.from({ length: 16 }, (_, i) => {
  const rec = i % 7 === 3, val = 180 + i * 413.7, paid = i % 3 === 0 ? val : i % 3 === 1 ? val / 2 : 0, tg = tagSet[i % 3];
  return `<tr><td class="mono">${(2210 - i).toString()}</td><td class="mono">${String(30 - i).padStart(2, '0')}/09/2026</td><td><span class="typ ${rec ? 'r' : 'd'}">${rec ? 'Receita' : 'Despesa'}</span></td><td style="color:var(--muted)">${pags[i % pags.length]}</td><td style="font-weight:800">${favs[i % favs.length]}</td><td style="color:var(--muted)">${i % 2 ? 'Castelo Real' : 'Universo 199'}</td><td><span class="tagc ${tg[0]}">${tg[1]}</span></td><td class="mono">${String(10 + (i % 18)).padStart(2, '0')}/10/2026</td><td class="r mono" style="color:var(--text)">${brl(val)}</td><td class="r mono pos">${brl(paid)}</td><td class="r mono ${val - paid > 0 ? 'neg' : ''}">${brl(val - paid)}</td><td class="c"><span class="ck ${paid >= val ? 'on' : ''}">${paid >= val ? '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"><path d="M20 6 9 17l-5-5"/></svg>' : ''}</span></td><td><div class="acts"><button class="ab ed" title="Editar">${ed}</button><button class="ab" title="Excluir">${dl}</button></div></td></tr>`;
}).join('');
document.getElementById('theme').addEventListener('click', () => document.documentElement.classList.toggle('dark'));
</script>
</body>
</html>
