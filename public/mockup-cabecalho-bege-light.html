<!doctype html>
<html lang="pt-BR" class="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cabeçalho bege</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFFCEC; --text: #1A1A0E; --muted: rgba(26,26,10,0.45); --faint: rgba(26,26,10,0.28);
    --hdr: #FBF35E; --hdr-border: #D9CF45; --hdr-text: #1A1A0E; --chip: rgba(26,26,10,0.09); --hover: rgba(26,26,10,0.07);
    --card: #FFFFFF; --card-border: #E0D8BF; --field-hover: #CFC4A2; --btn: rgba(26,26,10,0.06); --btn-hover: rgba(26,26,10,0.11);
    --line: #EFE8D2; --soft: #FAF7EE;
    --menu: #FFFFFF; --menu-border: #E0D8BF; --menu-hover: #FFF8D0;
    --grid: #A8A290; --row-odd: #FAF7EE; --row-hover: #FFF8D0; --th: #FFEC4D; --th-line: #B8A31F; --th-bottom: #8F7E10; --th-text: rgba(26,26,10,0.55);
    --tabshadow: inset 0 6px 8px -5px rgba(26,26,10,0.35);
    --emerald: #0A7A55; --amber: #B45309;
    --rail: 64px; --hh: 44px;
  }
  html.dark {
    --bg: #161612; --text: #F2F0E3; --muted: rgba(242,240,227,0.42); --faint: rgba(242,240,227,0.25);
    --hdr: #252520; --hdr-border: rgba(242,240,227,0.08); --hdr-text: #F2F0E3; --chip: rgba(216,30,30,0.13); --hover: rgba(242,240,227,0.06);
    --card: #1E1E18; --card-border: rgba(242,240,227,0.10); --field-hover: rgba(242,240,227,0.20); --btn: rgba(242,240,227,0.06); --btn-hover: rgba(242,240,227,0.11);
    --line: rgba(242,240,227,0.06); --soft: #1A1A15;
    --menu: #2E2E28; --menu-border: rgba(242,240,227,0.10); --menu-hover: rgba(255,229,0,0.08);
    --grid: rgba(242,240,227,0.20); --row-odd: #1E1E18; --row-hover: rgba(242,240,227,0.04); --th-text: rgba(26,26,10,0.58);
    --tabshadow: inset 0 6px 8px -5px rgba(0,0,0,0.55);
    --emerald: #34D399; --amber: #FBBF24;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; }
  button { font-family: inherit; }

  .anno { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 100; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; padding: 8px 10px; border-radius: 14px; background: #1A1A0E; color: #F2F0E3; font-size: 12px; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,.35); max-width: calc(100vw - 24px); }
  .anno b { color: #FFE500; }
  .anno button { border: 1px solid rgba(242,240,227,.18); background: transparent; color: #F2F0E3; padding: 5px 11px; border-radius: 999px; cursor: pointer; font-weight: 700; font-size: 11.5px; }

  /* Shell (já implementado) */
  .hdr { position: fixed; top: 0; left: 0; right: 0; z-index: 50; height: var(--hh); display: flex; align-items: stretch; background: var(--hdr); border-bottom: 1px solid var(--hdr-border); }
  .logo { width: var(--rail); display: grid; place-items: center; border-right: 1px solid var(--hdr-border); }
  .logo span { width: 32px; height: 32px; display: grid; place-items: center; background: #fff; color: #D81E1E; font-size: 8.5px; font-weight: 900; border: 1px solid rgba(26,26,10,0.12); }
  .ttl { display: flex; align-items: center; gap: 9px; padding: 0 16px; }
  .ico { width: 28px; height: 28px; display: grid; place-items: center; background: var(--chip); color: var(--hdr-text); }
  html.dark .ico { color: #D81E1E; }
  .ttl h1 { margin: 0; font-size: 15px; font-weight: 900; color: var(--hdr-text); }
  .pbtn { margin: auto 10px auto auto; width: 30px; height: 30px; display: grid; place-items: center; border: 1px solid rgba(26,26,10,0.16); background: rgba(26,26,10,0.06); color: var(--hdr-text); font-size: 11.5px; font-weight: 900; }
  html.dark .pbtn { border-color: rgba(242,240,227,0.14); background: rgba(216,30,30,0.13); }
  .rail { position: fixed; left: 0; top: var(--hh); bottom: 0; width: var(--rail); z-index: 45; background: var(--hdr); border-right: 1px solid var(--hdr-border); display: flex; flex-direction: column; align-items: center; padding: 8px 0; gap: 4px; }
  .nav { width: 48px; height: 44px; display: grid; place-items: center; color: var(--hdr-text); opacity: .6; }
  .nav.on { opacity: 1; background: #D81E1E; color: #fff; }
  .rail .sp { flex: 1; }
  main { margin-left: var(--rail); padding-top: var(--hh); }

  /* Abas penduradas na barra (padrão já aplicado na Entrada) */
  .tabrow { position: sticky; top: var(--hh); z-index: 20; display: flex; }
  .tab { height: 32px; min-width: 120px; padding: 0 14px; display: flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--hdr-border); border-top: 0; margin-left: -1px; background: var(--hdr); color: var(--hdr-text); box-shadow: var(--tabshadow); font-size: 11px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; cursor: pointer; }
  .tab:first-child { margin-left: 0; border-left: 0; }
  .tab .l { opacity: .55; } .tab:hover .l { opacity: .85; }
  .tab.on { box-shadow: var(--tabshadow), inset 0 -3px 0 #D81E1E; } .tab.on .l { opacity: 1; }

  .content { padding: 12px 16px 90px; display: flex; flex-direction: column; gap: 12px; }

  /* Barra de ferramentas */
  .tools { display: flex; align-items: center; gap: 6px; }
  .search { flex: 1; max-width: 560px; height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 10px; border: 1px solid var(--card-border); background: var(--card); color: var(--faint); transition: border-color 130ms, box-shadow 130ms; }
  .search:hover { border-color: var(--field-hover); }
  .search:focus-within { border-color: #D81E1E; box-shadow: 0 0 0 2px rgba(216,30,30,0.12); }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--text); font: 600 13px 'DM Sans'; caret-color: #D81E1E; }
  .search input::placeholder { color: var(--faint); font-weight: 500; }
  .cnt { height: 32px; display: flex; align-items: center; gap: 6px; padding: 0 11px; border: 1px solid #E3CF2A; background: #FFF4A8; font-size: 11.5px; font-weight: 700; color: rgba(26,26,10,.5); white-space: nowrap; }
  html.dark .cnt { border-color: rgba(255,229,0,.3); background: rgba(255,229,0,.08); color: var(--muted); }
  .cnt b { font-size: 14px; font-weight: 900; color: var(--text); }
  .ib { position: relative; width: 32px; height: 32px; display: grid; place-items: center; border: 1px solid var(--card-border); background: var(--card); color: var(--muted); cursor: pointer; transition: background 130ms, color 130ms, transform 130ms; }
  .ib:hover { background: var(--btn); color: var(--text); }
  .ib:active { transform: scale(0.95); }
  .ib.on { background: rgba(216,30,30,0.08); border-color: rgba(216,30,30,0.3); color: #D81E1E; }
  .ib.pri { background: #D81E1E; border-color: #D81E1E; color: #fff; }
  .ib.pri:hover { background: #B91818; }
  .ddw { position: relative; }
  .dd { position: absolute; right: 0; top: calc(100% + 4px); z-index: 30; min-width: 190px; background: var(--menu); border: 1px solid var(--menu-border); box-shadow: 0 16px 36px -10px rgba(0,0,0,0.3); display: none; }
  .dd.open { display: block; }
  .dd button { width: 100%; display: flex; align-items: center; gap: 9px; padding: 10px 12px; border: 0; background: transparent; color: var(--text); font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; text-align: left; }
  .dd button + button { border-top: 1px solid var(--menu-border); }
  .dd button:hover { background: var(--menu-hover); }
  .dd svg { color: #D81E1E; }

  /* Painel de filtros */
  .filters { border: 1px solid var(--card-border); background: var(--card); display: none; }
  .filters.open { display: block; }
  .fh { height: 32px; display: flex; align-items: center; padding: 0 6px 0 10px; background: var(--th); border-bottom: 1.5px solid var(--th-bottom); }
  .fh span { font-size: 9px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; color: var(--th-text); }
  .fh button { margin-left: auto; height: 22px; padding: 0 9px; border: 0; background: rgba(26,26,10,.08); color: #D81E1E; font-size: 9px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; cursor: pointer; }
  .fg { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 10px; padding: 10px; }
  .fl { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .lb { font-size: 9px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); padding-left: 1px; }
  .fi { height: 32px; border: 1px solid var(--card-border); background: var(--card); padding: 0 9px; color: var(--text); font: 600 12px 'DM Sans'; outline: 0; caret-color: #D81E1E; width: 100%; }
  .fi::placeholder { color: var(--faint); font-weight: 500; }
  .fi:focus { border-color: #D81E1E; box-shadow: 0 0 0 2px rgba(216,30,30,0.12); }

  /* Cartões de produto quadrados */
  .list { display: flex; flex-direction: column; gap: 8px; }
  .pc { position: relative; display: flex; align-items: center; gap: 14px; padding: 10px 12px 10px 10px; border: 1px solid var(--card-border); background: var(--card); transition: border-color 130ms, box-shadow 130ms; }
  .pc:hover { border-color: var(--field-hover); box-shadow: 0 8px 24px -12px rgba(0,0,0,0.25); }
  .img { width: 120px; height: 96px; flex-shrink: 0; border: 1px solid var(--card-border); background: var(--soft); display: grid; place-items: center; overflow: hidden; }
  .img i { width: 46px; height: 60px; display: block; border-radius: 4px; }
  .mid { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .nm { font-size: 15px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.3; }
  .chips { display: flex; gap: 4px; flex-wrap: wrap; }
  .chip { height: 22px; display: inline-flex; align-items: center; gap: 5px; padding: 0 7px; border: 1px solid var(--card-border); background: var(--soft); font: 500 10.5px 'DM Mono'; color: var(--muted); }
  .chip svg { color: #D81E1E; opacity: .8; }
  .meta { display: flex; gap: 6px; align-items: center; font-size: 9px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: var(--faint); }
  .meta span { display: inline-flex; align-items: center; gap: 4px; }
  .meta svg { color: #D81E1E; opacity: .65; }
  .price { display: flex; align-items: baseline; gap: 3px; color: #D81E1E; }
  .price small { font-size: 12px; font-weight: 900; }
  .price b { font-size: 26px; font-weight: 900; letter-spacing: -0.03em; line-height: 1; }
  .side { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; flex-shrink: 0; width: 280px; }
  .kv { display: flex; flex-direction: column; gap: 4px; }
  .kv .k { height: 22px; display: flex; align-items: center; gap: 5px; padding: 0 7px 0 3px; border: 1px solid var(--card-border); background: var(--soft); font-size: 8.5px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .kv .k span { width: 16px; height: 16px; display: grid; place-items: center; background: rgba(216,30,30,.1); color: #D81E1E; }
  .kv .v { height: 34px; display: flex; align-items: center; padding: 0 9px; border: 1px solid var(--card-border); background: var(--card); font-size: 15px; font-weight: 900; }
  .kv .v.low { color: #D81E1E; }
  .acts { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; opacity: 0; transition: opacity 130ms; }
  .pc:hover .acts { opacity: 1; }
  .acts button { width: 26px; height: 26px; display: grid; place-items: center; border: 1px solid var(--card-border); background: var(--card); color: var(--muted); cursor: pointer; }
  .acts button:hover { background: #D81E1E; color: #fff; border-color: #D81E1E; }
  .mae { position: absolute; top: -1px; left: -1px; width: 22px; height: 22px; display: grid; place-items: center; background: #F59E0B; color: #fff; z-index: 1; }
  .ph-place { padding: 60px 20px; text-align: center; color: var(--muted); font-weight: 600; font-size: 13px; border: 1px dashed var(--card-border); }
</style>
</head>
<body>

<header class="hdr">
  <div class="logo"><span>R$1,99</span></div>
  <div class="ttl"><div class="ico"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.3 7 12 12l8.7-5M12 22V12"/></svg></div><h1>Inventory</h1></div>
  <div class="pbtn">DM</div>
</header>
<aside class="rail">
  <div class="nav on"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 8 12 3 3 8v8l9 5 9-5Z"/></svg></div>
  <div class="nav"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"><path d="M12 20V10M18 20V4M6 20v-4"/></svg></div>
  <div class="nav"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg></div>
  <div class="nav"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg></div>
  <div class="nav"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></div>
  <div class="sp"></div>
  <div class="nav"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/></svg></div>
  <div class="nav"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"><circle cx="12" cy="12" r="3"/><path d="M12 1v3M12 20v3M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M1 12h3M20 12h3"/></svg></div>
</aside>

<main>
  <div class="tabrow"><button class="tab on" data-t="p"><span class="l">Produtos</span></button><button class="tab" data-t="e"><span class="l">Estoque</span></button></div>

  <div class="content" id="c-p">
    <div class="tools">
      <label class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input placeholder="Buscar por nome, EAN, SKU…"></label>
      <span class="cnt"><b>4.812</b> produtos</span>
      <button class="ib" title="Cadastro mobile"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/></svg></button>
      <button class="ib" id="fbtn" title="Filtros"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M22 3H2l8 9.46V19l4 2v-8.54z"/></svg></button>
      <div class="ddw"><button class="ib" data-dd="print" title="Imprimir"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 2H2v10l9.29 9.29a1 1 0 0 0 1.41 0l8.6-8.6a1 1 0 0 0 0-1.41z"/><circle cx="7" cy="7" r="1.5"/></svg></button>
        <div class="dd" id="dd-print"><button><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 2H2v10l9.29 9.29a1 1 0 0 0 1.41 0l8.6-8.6a1 1 0 0 0 0-1.41z"/></svg>Etiquetas</button><button><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M16 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8Z"/><path d="M15 3v5h6"/></svg>Placas</button></div></div>
      <div class="ddw"><button class="ib pri" data-dd="new" title="Novo"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
        <div class="dd" id="dd-new"><button><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>Lista de produtos</button><button><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Novo produto</button></div></div>
    </div>

    <div class="filters" id="filters">
      <div class="fh"><span>Filtros</span><button>Limpar filtros</button></div>
      <div class="fg" id="fg"></div>
    </div>

    <div class="list" id="list"></div>
  </div>
  <div class="content" id="c-e" style="display:none"><div class="ph-place">Conteúdo da aba <b>Estoque</b> — fica como está nesta etapa (só a aba muda).</div></div>
</main>

<div class="anno"><span><b>Mockup</b> — cabeçalho e menu em <b>#FBF35E</b></span><button id="cmp">Ver antes (#FFE500)</button></div>

<script>
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t));
  document.getElementById('c-p').style.display = t.dataset.t === 'p' ? '' : 'none';
  document.getElementById('c-e').style.display = t.dataset.t === 'e' ? '' : 'none';
}));
document.getElementById('fbtn').addEventListener('click', e => { e.currentTarget.classList.toggle('on'); document.getElementById('filters').classList.toggle('open'); });
document.querySelectorAll('[data-dd]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); const d = document.getElementById('dd-' + b.dataset.dd); const o = d.classList.contains('open'); document.querySelectorAll('.dd').forEach(x => x.classList.remove('open')); if (!o) d.classList.add('open'); }));
document.addEventListener('click', () => document.querySelectorAll('.dd').forEach(x => x.classList.remove('open')));
document.getElementById('fg').innerHTML = [['EAN', '789…'], ['Código interno', 'SKU-001…'], ['Categoria', 'Doméstico…'], ['Subcategoria', 'Cozinha…'], ['Marca', 'Lacta…'], ['Nome', 'Chocolate…'], ['Localização', 'Corredor A…']].map(f => `<div class="fl"><span class="lb">${f[0]}</span><input class="fi" placeholder="${f[1]}"></div>`).join('');
const P = [
  ['COLHER PLASTICA REFEICAO REFORCADA C/10', '7898411040547', '4054', '4,80', 124, 'C3-A', 'PLASTICOS ROMA', 'UTILIDADES', 'DESCARTÁVEIS', '#E9D5FF'],
  ['CHOCOLATE LACTA AO LEITE 80G', '7622210951052', '1187', '6,99', 8, 'A1-B', 'LACTA', 'ALIMENTOS', 'DOCES', '#FDE68A', true],
  ['ROLO DE ESPUMA C/CABO 10CM', '7898254361540', '0154', '5,49', 36, 'D2-C', 'DISPEL', 'FERRAMENTAS', 'PINTURA', '#BFDBFE'],
  ['VELA PARA FILTRO CERÂMICA', '7898254362370', '0237', '8,90', 0, '—', 'DISPEL', 'UTILIDADES', 'COZINHA', '#FECACA'],
  ['ENVELOPE BRANCO CART.C/06', '7898254363179', '0317', '1,99', 212, 'E1-A', 'DISPEL', 'PAPELARIA', 'ESCRITÓRIO', '#D9F99D'],
];
const ic = {
  bar: '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M3 5v14M8 5v14M12 5v14M17 5v14M21 5v14"/></svg>',
  hash: '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M4 9h16M4 15h16M10 3 8 21M16 3l-2 18"/></svg>',
  tag: '<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 2H2v10l9.29 9.29a1 1 0 0 0 1.41 0l8.6-8.6a1 1 0 0 0 0-1.41z"/></svg>',
  grid: '<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>',
  box: '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M21 8 12 3 3 8v8l9 5 9-5Z"/></svg>',
  pin: '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>',
  print: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>',
  edit: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>',
};
document.getElementById('list').innerHTML = P.map(p => `<div class="pc">${p[10] ? `<span class="mae" title="Produto Filho">${ic.box}</span>` : ''}
  <div class="acts"><button title="Enviar para fila de impressão">${ic.print}</button><button title="Editar produto">${ic.edit}</button></div>
  <div class="img"><i style="background:${p[9]}"></i></div>
  <div class="mid"><div class="nm">${p[0]}</div>
    <div class="chips"><span class="chip">${ic.bar}${p[1]}</span><span class="chip">${ic.hash}${p[2]}</span></div>
    <div class="price"><small>R$</small><b>${p[3]}</b></div>
    <div class="meta"><span>${ic.tag}${p[6]}</span>·<span>${ic.grid}${p[7]}</span>·<span>${ic.grid}${p[8]}</span></div>
  </div>
  <div class="side">
    <div class="kv"><div class="k"><span>${ic.box}</span>Estoque</div><div class="v ${p[4] < 10 ? 'low' : ''}">${p[4]} un.</div></div>
    <div class="kv"><div class="k"><span>${ic.pin}</span>Localização</div><div class="v">${p[5]}</div></div>
  </div></div>`).join('');
let old = false;
document.getElementById('cmp').addEventListener('click', e => {
  old = !old;
  document.documentElement.style.setProperty('--hdr', old ? '#FFE500' : '#FBF35E');
  document.documentElement.style.setProperty('--hdr-border', old ? '#D4C000' : '#D9CF45');
  e.currentTarget.textContent = old ? 'Ver depois (#FBF35E)' : 'Ver antes (#FFE500)';
});
</script>
</body>
