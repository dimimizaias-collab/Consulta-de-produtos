<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Tarefas — Dark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700;9..40,800;9..40,900&display=swap" rel="stylesheet">
<style>
  :root {
    --page: #151510;
    --modal: #1E1E18;
    --header: #FFE500;
    --header-border: #C8B800;
    --chip-bg: rgba(216,30,30,0.16);
    --chip-color: #D81E1E;
    --title: #F2F0E3;
    --muted: rgba(242,240,227,0.42);
    --card-bg: #252520;
    --card-border: rgba(242,240,227,0.08);
    --card-shadow: 0 10px 24px -14px rgba(0,0,0,0.6);
    --input-bg: rgba(242,240,227,0.05);
    --input-border: rgba(242,240,227,0.12);
    --label: rgba(242,240,227,0.42);
    --red: #D81E1E;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--page); font-family: 'DM Sans', -apple-system, sans-serif; min-height: 100vh; padding: 48px 24px 96px; color: var(--title); }
  .page { max-width: 620px; margin: 0 auto; }
  .eyebrow { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.16em; color: rgba(242,240,227,0.40); text-align: center; margin-bottom: 16px; }

  .modal { background: var(--modal); border-radius: 24px; border: 1px solid rgba(242,240,227,0.08); box-shadow: 0 30px 60px -20px rgba(0,0,0,0.6); overflow: hidden; }
  .modal-header { background: var(--header); border-bottom: 1px solid var(--header-border); padding: 20px 24px; display: flex; align-items: center; gap: 14px; }
  .chip-icon { width: 44px; height: 44px; border-radius: 14px; background: var(--chip-bg); color: var(--chip-color); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .header-text { flex: 1; min-width: 0; }
  .header-eyebrow { font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.18em; color: rgba(26,26,10,0.55); }
  .header-title { font-size: 18px; font-weight: 800; color: #1A1A0E; line-height: 1.2; margin-top: 2px; }
  .close-btn { width: 36px; height: 36px; border-radius: 12px; flex-shrink: 0; background: rgba(26,26,10,0.08); border: 1px solid rgba(26,26,10,0.10); color: rgba(26,26,10,0.50); display: flex; align-items: center; justify-content: center; }

  .modal-body { padding: 24px; display: flex; flex-direction: column; gap: 16px; max-height: 620px; overflow-y: auto; }

  .section { background: var(--card-bg); border: 1px solid var(--card-border); box-shadow: var(--card-shadow); border-radius: 18px; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
  .section-head { display: flex; align-items: center; gap: 8px; }
  .section-head svg { color: var(--red); flex-shrink: 0; }
  .section-title { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; color: var(--title); }
  .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; color: var(--label); }
  .field select, .field textarea { background: var(--input-bg); border: 1px solid var(--input-border); border-radius: 12px; padding: 10px 13px; font-size: 13px; font-family: inherit; color: var(--title); outline: none; }
  .field textarea { resize: none; min-height: 66px; }

  .item-row { background: rgba(242,240,227,0.03); border: 1px solid var(--card-border); border-radius: 12px; padding: 10px 14px; display: flex; align-items: center; gap: 10px; }
  .item-badge { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 900; flex-shrink: 0; background: rgba(216,30,30,0.16); color: #ff6b6b; }
  .item-name { font-size: 13px; font-weight: 800; color: var(--title); }
  .item-meta { font-size: 10px; color: rgba(242,240,227,0.35); font-weight: 600; }
  .item-check { margin-left: auto; color: #34D399; }
  .add-item-btn { padding: 12px; border-radius: 12px; border: 2px dashed rgba(216,30,30,0.35); color: #ff6b6b; font-size: 12.5px; font-weight: 800; text-align: center; }

  .pill-row { display: flex; gap: 8px; }
  .pill { flex: 1; padding: 10px; border-radius: 12px; font-size: 11px; font-weight: 900; text-align: center; border: 1.5px solid var(--input-border); color: rgba(242,240,227,0.5); background: var(--input-bg); }
  .pill.alta { background: var(--red); border-color: var(--red); color: #fff; }
  .pill.media { background: #fbbf24; border-color: #fbbf24; color: #1A1A0E; }
  .pill.baixa { background: #10b981; border-color: #10b981; color: #fff; }

  .modal-footer { padding: 18px 24px 22px; display: flex; gap: 10px; border-top: 1px solid rgba(242,240,227,0.07); }
  .btn { flex: 1; padding: 13px; border-radius: 14px; font-size: 13px; font-weight: 800; text-align: center; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .btn-cancel { background: rgba(242,240,227,0.07); color: rgba(242,240,227,0.55); }
  .btn-save { background: var(--red); color: #fff; box-shadow: 0 10px 24px -8px rgba(216,30,30,0.5); }
</style>
</head>
<body>
<div class="page">
  <div class="eyebrow">Desktop — mesmo padrão do modal "Editar Produto"</div>
  <div class="modal">
    <div class="modal-header">
      <div class="chip-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      </div>
      <div class="header-text">
        <div class="header-eyebrow">Tarefas</div>
        <div class="header-title">Nova Tarefa</div>
      </div>
      <button class="close-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <div class="modal-body">
      <div class="section">
        <div class="section-head">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          <span class="section-title">Dados da tarefa</span>
        </div>
        <div class="field-grid">
          <div class="field"><label>Responsável</label><select><option>Marina Souza</option></select></div>
          <div class="field"><label>Tipo</label><select><option>Revisão de mercadoria</option></select></div>
        </div>
      </div>

      <div class="section">
        <div class="section-head">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41 11 3.83A2 2 0 0 0 9.59 3.24H4a1 1 0 0 0-1 1v5.59a2 2 0 0 0 .59 1.41l9.58 9.59a2 2 0 0 0 2.82 0l4.6-4.6a2 2 0 0 0 0-2.82z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>
          <span class="section-title">Itens para revisão</span>
        </div>
        <div class="item-row">
          <div class="item-badge">1</div>
          <div style="flex:1;">
            <div class="item-name">Lixeira Rattan com Pedal 6L</div>
            <div class="item-meta">EAN 7891234560012</div>
          </div>
          <div class="item-check">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
        </div>
        <div class="add-item-btn">+ Adicionar item</div>
      </div>

      <div class="section">
        <div class="section-head">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span class="section-title">Observações &amp; prioridade</span>
        </div>
        <div class="field">
          <label>Observação</label>
          <textarea placeholder="Observações gerais sobre a tarefa..."></textarea>
        </div>
        <div class="field">
          <label>Classificação</label>
          <div class="pill-row">
            <div class="pill alta">Alta</div>
            <div class="pill">Média</div>
            <div class="pill">Baixa</div>
          </div>
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn btn-cancel">Cancelar</button>
      <button class="btn btn-save">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        Enviar
      </button>
    </div>
  </div>
</div>
</body>
</html>
