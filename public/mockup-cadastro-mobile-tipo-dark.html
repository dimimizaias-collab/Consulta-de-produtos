<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Cadastro Mobile — Selecionar Tipo — Dark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700;9..40,800;9..40,900&display=swap" rel="stylesheet">
<style>
  :root {
    --page: #151510;
    --modal: #1E1E18;
    --header: #FFE500;
    --header-border: #C8B800;
    --chip-bg: rgba(216,30,30,0.16);
    --chip-color: #D81E1E;
    --title: #F2F0E3;
    --muted: rgba(242,240,227,0.42);
    --card-bg: #252520;
    --card-border: rgba(242,240,227,0.08);
    --card-shadow: 0 10px 24px -14px rgba(0,0,0,0.6);
    --input-bg: rgba(242,240,227,0.05);
    --input-border: rgba(242,240,227,0.12);
    --label: rgba(242,240,227,0.42);
    --red: #D81E1E;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--page);
    font-family: 'DM Sans', -apple-system, sans-serif;
    min-height: 100vh;
    padding: 64px 24px 96px;
    color: var(--title);
  }
  .page { max-width: 560px; margin: 0 auto; }
  .eyebrow { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.16em; color: rgba(242,240,227,0.40); text-align: center; margin-bottom: 16px; }

  .modal {
    background: var(--modal);
    border-radius: 24px;
    border: 1px solid rgba(242,240,227,0.08);
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.6);
    overflow: hidden;
  }
  .modal-header {
    background: var(--header);
    border-bottom: 1px solid var(--header-border);
    padding: 20px 24px;
    display: flex; align-items: center; gap: 14px;
  }
  .chip-icon {
    width: 44px; height: 44px; border-radius: 14px;
    background: var(--chip-bg); color: var(--chip-color);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .header-text { flex: 1; min-width: 0; }
  .header-eyebrow { font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.18em; color: rgba(26,26,10,0.55); }
  .header-title { font-size: 18px; font-weight: 800; color: #1A1A0E; line-height: 1.2; margin-top: 2px; }
  .close-btn {
    width: 36px; height: 36px; border-radius: 12px; flex-shrink: 0;
    background: rgba(26,26,10,0.08); border: 1px solid rgba(26,26,10,0.10);
    color: rgba(26,26,10,0.50); display: flex; align-items: center; justify-content: center;
  }

  .modal-body { padding: 24px; }
  .section-label { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; color: var(--label); margin-bottom: 14px; }
  .type-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .type-card {
    background: var(--card-bg); border: 1px solid var(--card-border); box-shadow: var(--card-shadow);
    border-radius: 18px; padding: 20px; display: flex; flex-direction: column; align-items: flex-start; gap: 12px;
    cursor: pointer;
  }
  .type-card.hover { border-color: rgba(216,30,30,0.40); background: rgba(216,30,30,0.06); }
  .type-icon { width: 44px; height: 44px; border-radius: 12px; background: rgba(242,240,227,0.06); color: rgba(242,240,227,0.5); display: flex; align-items: center; justify-content: center; }
  .type-card.hover .type-icon { background: rgba(216,30,30,0.16); color: var(--red); }
  .type-title { font-size: 13.5px; font-weight: 900; color: var(--title); line-height: 1.25; }
  .type-card.hover .type-title { color: var(--red); }
  .type-desc { font-size: 11.5px; font-weight: 600; color: rgba(242,240,227,0.42); margin-top: 2px; }
</style>
</head>
<body>
<div class="page">
  <div class="eyebrow">Desktop — diálogo centralizado, mesmo padrão do modal "Editar Produto"</div>
  <div class="modal">
    <div class="modal-header">
      <div class="chip-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
      </div>
      <div class="header-text">
        <div class="header-eyebrow">Cadastro Mobile</div>
        <div class="header-title">Selecionar Tipo</div>
      </div>
      <button class="close-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <div class="modal-body">
      <div class="section-label">Escolha o tipo de operação</div>
      <div class="type-grid">
        <div class="type-card">
          <div class="type-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 2h6a2 2 0 0 1 2 2v2H7V4a2 2 0 0 1 2-2z"/><rect x="5" y="4" width="14" height="18" rx="2"/><line x1="8" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="16" y2="14"/><line x1="8" y1="18" x2="12" y2="18"/></svg>
          </div>
          <div>
            <div class="type-title">Conferência de mercadoria</div>
            <div class="type-desc">Cadastro e conferência de produtos</div>
          </div>
        </div>
        <div class="type-card hover">
          <div class="type-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          </div>
          <div>
            <div class="type-title">Tarefas</div>
            <div class="type-desc">Organização interna e lembretes</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
